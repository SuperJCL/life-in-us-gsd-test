<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>计划手记</title>
<style>
:root{
  --paper:#F2F5F9; --surface:#FFFFFF; --ink:#1B2740; --muted:#5E6B82; --line:#D9E0EA; --red:#B4423A;
  --c-lang:#0E7C7B; --c-lang-s:#DCEFEE;
  --c-pro:#3D5BC4; --c-pro-s:#E2E8FA;
  --c-fit:#C2522D; --c-fit-s:#F8E3DA;
  --c-job:#A87000; --c-job-s:#F6ECD2;
  --c-oth:#6B7385; --c-oth-s:#E6E9EF;
  --today:#1B2740; --today-ink:#FFFFFF;
  --serif:"Songti SC","STSong",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121826; --surface:#1A2234; --ink:#E6EBF4; --muted:#98A3B8; --line:#2C3650; --red:#E07A70;
    --c-lang:#4FC1BF; --c-lang-s:#16393B; --c-pro:#8FA6F2; --c-pro-s:#232E52;
    --c-fit:#EE8B66; --c-fit-s:#41261C; --c-job:#E2A93B; --c-job-s:#3A2E16; --c-oth:#A3ABBD; --c-oth-s:#2A3146;
    --today:#E6EBF4; --today-ink:#121826; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121826; --surface:#1A2234; --ink:#E6EBF4; --muted:#98A3B8; --line:#2C3650; --red:#E07A70;
  --c-lang:#4FC1BF; --c-lang-s:#16393B; --c-pro:#8FA6F2; --c-pro-s:#232E52;
  --c-fit:#EE8B66; --c-fit-s:#41261C; --c-job:#E2A93B; --c-job-s:#3A2E16; --c-oth:#A3ABBD; --c-oth-s:#2A3146;
  --today:#E6EBF4; --today-ink:#121826; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c-lang);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 48px}
.k-lang{--c:var(--c-lang);--s:var(--c-lang-s)} .k-pro{--c:var(--c-pro);--s:var(--c-pro-s)}
.k-fit{--c:var(--c-fit);--s:var(--c-fit-s)} .k-job{--c:var(--c-job);--s:var(--c-job-s)} .k-oth{--c:var(--c-oth);--s:var(--c-oth-s)}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.title h1{font-family:var(--serif);font-weight:800;font-size:clamp(26px,4vw,34px);margin:0;letter-spacing:.02em}
.title p{margin:4px 0 0;color:var(--muted)}
.counter{display:flex;align-items:baseline;gap:10px}
.counter .n{font-family:var(--serif);font-weight:800;font-size:clamp(44px,8vw,64px);line-height:1;color:var(--c-lang)}
.counter .lbl{color:var(--muted)}
.arrival{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-top:6px}
.arrival input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px}

nav.tabs{display:flex;gap:4px;margin:20px 0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav.tabs button{background:none;border:0;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.toolbar{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;align-items:center;padding-bottom:6px}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
#snapshotBtn,#undoImportBtn{color:var(--ink);background:var(--c-job-s);border-color:var(--c-job);font-size:12px}
#logoutBtn,.who{font-size:12px}
.who{color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.who{display:none}}
.icon{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.primary{background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:7px 14px;font-weight:600}
.primary:disabled{opacity:.4;cursor:default}
select,input[type=date],input[type=text],input[type=number],textarea{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--paper)}
.empty{color:var(--muted);font-size:14px;padding:6px 0;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.hidden{display:none !important}

/* week */
.wk-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.wk-head h2{font-family:var(--serif);font-size:24px;margin:0}
.wk-head .range{color:var(--muted)}
.wk-head .nav{margin-left:auto;display:flex;gap:6px}
.areas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
@media (max-width:720px){.areas{grid-template-columns:repeat(3,minmax(0,1fr))}}
.area{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:10px 12px}
.area .nm{font-size:13px;color:var(--muted)}
.area .v{font-family:var(--serif);font-weight:800;font-size:26px;line-height:1.2;color:var(--c)}
.area .v small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}
.area .goal{font-size:12px;color:var(--muted)}
.area .goal.ok{color:var(--c)}
.wk-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.wk-layout{grid-template-columns:1fr}}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media (max-width:900px){.days{grid-template-columns:1fr}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:170px;display:flex;flex-direction:column;gap:5px;text-align:left}
@media (max-width:900px){.day{min-height:0}}
.day.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day .dh{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--muted)}
.day .dh b{font-size:16px;color:var(--ink)}
.day.today .dh b{background:var(--today);color:var(--today-ink);border-radius:6px;padding:0 6px}
.ent{font-size:12.5px;line-height:1.4;background:var(--s);color:var(--ink);border-left:3px solid var(--c);border-radius:4px;padding:3px 6px;word-break:break-word;display:flex;gap:4px;align-items:flex-start}
.ent span{flex:1;min-width:0}
.ent.done{background:transparent;color:var(--muted)}
.ent[data-edit],.ent[data-edittask]{cursor:pointer}
.ent[data-edit]:hover,.ent[data-edittask]:hover{filter:brightness(.97);box-shadow:0 0 0 1px var(--c)}
.ent.dragging{opacity:.4}
.day.drop{border-color:var(--c-pro);box-shadow:inset 0 0 0 2px var(--c-pro)}
.editable{cursor:pointer}
.editable:hover{box-shadow:0 0 0 1px var(--c)}
.x{background:none;border:0;color:var(--muted);font-size:15px;line-height:1;padding:0 2px}
.x:hover{color:var(--red)}
.review{margin-top:18px}
.review h3,.side h3{font-family:var(--serif);font-size:18px;margin:0 0 4px}
.review p.sub,.side p.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.review textarea{width:100%;min-height:90px;resize:vertical;background:var(--paper)}

/* composer */
.comp{display:grid;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{border:1px dashed var(--c);background:var(--s);color:var(--c);border-radius:6px;padding:3px 9px;font-size:12.5px}
.presets .hint{font-size:12px;color:var(--muted);width:100%}
.pchip{display:inline-flex;align-items:stretch}
.pchip.editing button[data-preset]{border-style:solid;border-radius:6px 0 0 6px;cursor:default;opacity:.75}
.presets .pdel{border:1px solid var(--c);border-left:0;border-radius:0 6px 6px 0;background:var(--surface);color:var(--red);padding:0 7px;font-size:14px;line-height:1}
.presets .plus{border:1px dashed var(--line);background:none;color:var(--muted)}
.presets .plus:hover{color:var(--ink);border-color:var(--muted)}
.presets .pedit{border:0;background:none;color:var(--muted);text-decoration:underline;padding:3px 4px}
.presets .padd{width:150px;padding:3px 8px;font-size:12.5px;border-radius:6px;border:1px solid var(--c);background:var(--surface)}
.comp textarea{width:100%;min-height:64px;resize:vertical}
.comp .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.comp .when{font-size:13px;color:var(--muted)}

/* calendar */
.cal-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:24px;align-items:start}
@media (max-width:820px){.cal-layout{grid-template-columns:1fr}}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h2{font-family:var(--serif);font-size:22px;margin:0}
.cal-head .nav{display:flex;gap:6px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cell{position:relative;min-height:82px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 6px 5px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cell.out{opacity:.38}
.cell.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cell .d{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cell.today .d{background:var(--today);color:var(--today-ink)}
.cell.arr::after{content:"抵美";position:absolute;top:6px;right:6px;font-size:10px;color:var(--c-lang);border:1px solid var(--c-lang);border-radius:4px;padding:0 3px}
.chips{display:flex;flex-direction:column;gap:2px}
.chip{font-size:11px;line-height:1.35;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--s);color:var(--c)}
.chip.due{background:transparent;border:1px dashed var(--c-job);color:var(--c-job)}
.chip.done{background:transparent;color:var(--muted);text-decoration:line-through}
.more{font-size:11px;color:var(--muted)}
@media (max-width:560px){
  .cell{min-height:54px;padding:4px}
  .chips{flex-direction:row;flex-wrap:wrap;gap:3px}
  .chip{font-size:0;height:7px;width:7px;padding:0;border-radius:50%;background:var(--c)}
  .chip.due{background:transparent;border-color:var(--c-job)} .chip.done{background:var(--muted)}
  .more,.cell.arr::after{display:none}
}
.sect{font-size:13px;color:var(--muted);margin:14px 0 6px}
ul.items{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.items li{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:8px;background:var(--paper)}
.tag{flex:none;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--s);color:var(--c);margin-top:2px;max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-text{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.panel h3{font-family:var(--serif);font-size:19px;margin:0}
.panel .sub{color:var(--muted);font-size:13px;margin:2px 0 14px}

/* goals */
.goals{display:grid;gap:18px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.group-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.group-h .p{font-family:var(--serif);font-weight:800;color:var(--c);font-size:18px}
.group-h h3{margin:0;font-size:17px}
.group-h .cnt{margin-left:auto;color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted);margin:4px 0 0}
.bar{height:4px;background:var(--line);border-radius:2px;margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:2px;transition:width .3s}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.task input[type=checkbox]{width:18px;height:18px;accent-color:var(--c)}
.task.isdone .tt{color:var(--muted);text-decoration:line-through}
.task .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.task .meta input[type=date]{font-size:12px;padding:3px 5px}
.task .od{color:var(--red)}
.task .sub-h{font-size:12px;color:var(--c);font-weight:600}
@media (max-width:560px){.task{grid-template-columns:auto 1fr}.task .meta{grid-column:2}}
.addtask{display:flex;gap:8px;margin-top:10px}
.addtask input{flex:1;min-width:0}
.lifts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.lift{background:var(--paper);border-radius:10px;padding:12px}
.lift .ln{font-size:14px;font-weight:600}
.lift .lv{font-family:var(--serif);font-weight:800;font-size:28px;color:var(--c);line-height:1.2}
.lift .lv small{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--muted)}
.lift .lbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}
.lift .lbar i{display:block;height:100%;background:var(--c)}
.lift .upd{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.lift .upd input{width:80px;padding:4px 6px}
.lift .hist{font-size:12px;color:var(--muted);margin-top:6px}
/* Phase 12：目标页「已归档」区，只在 .arch 里生效，主列表里的同名组件不变 */
.arch .group{padding:16px} .arch .group-h{gap:8px} .arch .group-h h3{font-size:16px;font-weight:600}
.arch .group-h .cnt,.arch .note,.arch .task .meta,.arch .lift .hist,.arch .lift .lv small{font-size:12px;font-weight:400}
.arch .task{gap:8px} .arch .task .meta{gap:8px} .arch .task .tt{font-size:14px;font-weight:400}
.arch .bar{margin:8px 0} .arch .lift .ln{font-size:14px;font-weight:600}
.arch .lift .lv{font-size:16px;font-weight:600}
.arch>summary{min-height:36px;padding:8px 0;font-size:14px;color:var(--muted);cursor:pointer}
.group.arch-g,.lift.arch-l{--c:var(--c-oth);--s:var(--c-oth-s);color:var(--muted)}
.arch-mark{font-size:12px;padding:0 8px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.task.ro{grid-template-columns:1fr auto}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-month{font-family:var(--serif);font-size:18px;margin:22px 0 8px}
.tl-month:first-child{margin-top:0}
.tl-item{position:relative;padding:8px 12px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;gap:10px;align-items:flex-start}
.tl-item::before{content:"";position:absolute;left:-21px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--c);border:2px solid var(--paper)}
.tl-date{flex:none;font-size:13px;color:var(--muted);width:48px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.status{font-size:12px;color:var(--muted);margin-top:28px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5;display:flex;gap:14px;align-items:center}
.toast.on{opacity:1}
.toast.act{pointer-events:auto}
.toast button{background:none;border:0;color:var(--c-lang-s);font-weight:700;padding:0;text-decoration:underline}
.toast[data-cloud] button{font-weight:600;flex:none}
.toast[data-cloud]{width:max-content;max-width:calc(100vw - 32px)}
body[data-gate] :is(button,input,select,textarea):disabled{opacity:.55;cursor:not-allowed}
body[data-gate] .primary:disabled{opacity:.4}
body[data-gate] .ghost[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
body[data-gate] [aria-disabled="true"]{cursor:default}
body[data-gate] .ent[aria-disabled="true"]:hover,body[data-gate] .editable[aria-disabled="true"]:hover{filter:none;box-shadow:none}
dialog#editor,dialog#confirm{border:1px solid var(--line);border-radius:14px;padding:20px;width:min(460px,calc(100vw - 24px));background:var(--surface);color:var(--ink)}
dialog#editor::backdrop,dialog#confirm::backdrop{background:rgba(10,16,30,.45)}
@media (max-width:560px){dialog#editor,dialog#confirm{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:14px 14px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
dialog#confirm .ed-h h3{font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.2}
#cf-body{font-size:14px;word-break:break-word}
#cf-body p{margin:0}
#cf-body p+p{margin-top:6px}
#cf-body p.cf-who{color:var(--muted)}
#cf-body p.cf-warn{color:var(--ink);background:var(--c-job-s);border-left:3px solid var(--c-job);padding:6px 10px;border-radius:6px}
@media (max-width:560px){dialog#confirm .ed-foot .sp{display:none}dialog#confirm .ed-foot button{flex:1;min-height:44px}}
.ed-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.ed-h h3{font-family:var(--serif);font-size:19px;margin:0}
.ed-grid{display:grid;gap:12px}
.ed-grid label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.ed-grid textarea{width:100%;min-height:96px;resize:vertical;color:var(--ink)}
.ed-task{padding:10px 12px;background:var(--paper);border-radius:8px}
.ed-foot{display:flex;gap:8px;align-items:center;margin-top:16px}
.ed-foot .sp{flex:1}
.ed-foot .hint{font-size:12px;color:var(--muted)}
@media (max-width:560px){.ed-foot .hint{display:none}}
.danger{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--red)}
.danger:hover{border-color:var(--red)}
/* login */
:is(#login,#boot,dialog#confirm){font-size:14px;line-height:1.55}
:is(#syncbar,#boot,dialog#confirm) button{font-size:14px}
#login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px max(20px,env(safe-area-inset-right)) 48px max(20px,env(safe-area-inset-left))}
@media (min-width:561px){#login{padding-top:64px;padding-bottom:64px}}
#login h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,4vw,34px);line-height:1.2;margin:0;text-align:center}
#login .lead{color:var(--muted);text-align:center;margin:8px 0 24px}
.gate-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
#login label.f{display:block;margin:0 0 4px}
#login input{font-size:16px;line-height:1.55;width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--paper)}
#login .pw-row{position:relative}
#login .pw-row input{padding-right:64px}
#login .pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px}
#login #loginForm>input{margin-bottom:16px}
#login button{font-size:14px}
#login .primary{width:100%}
#login-err{color:var(--red);margin:8px 0 0;overflow-wrap:anywhere}
#login-err:empty{display:none}
#login #login-err+.primary{margin-top:16px}
#login .fine{font-size:12px;color:var(--muted);text-align:center;margin:16px 0 0}

<script>
(function(){
const CATS=[{n:"语言",k:"lang"},{n:"专业",k:"pro"},{n:"健身",k:"fit",direct:true},{n:"求职",k:"job"},{n:"其他",k:"oth"}];
const CK=Object.fromEntries(CATS.map(c=>[c.n,c.k]));
const hasCat=n=>Object.prototype.hasOwnProperty.call(CK,n);
const kOf=n=>hasCat(n)?CK[n]:"oth";
const LEGACY={"学习":"专业","活动社交":"求职","生活":"其他","里程碑":"其他"};
/* PLAN-05：内置组和任务的 id 冻结为 DEFAULT_PLAN 里写明的值；以后新增的组、任务、力量项分别用 g-、t-、l- 加 uid()，不会撞上 P 开头的内置 id、c- 开头的自定义待办 id 和内置力量 id */
const GROUP_ID_RE=/^(P\d{1,3}|g-[A-Za-z0-9_-]{1,40})$/,PLAN_TASK_ID_RE=/^(P\d{1,3}-\d{1,3}|t-[A-Za-z0-9_-]{1,40})$/,LIFT_ID_RE=/^([a-z]{1,16}|l-[A-Za-z0-9_-]{1,40})$/;
/* SEC-01：导入白名单。记录 id、自定义待办 id、进度键（内置 P<n>-<i>，以及以后新增的 t-、自定义的 c-）和日期的格式；力量键和组 id 沿用上面两条 */
const LOG_ID_RE=/^[A-Za-z0-9_-]{1,64}$/,CUSTOM_ID_RE=/^c-[A-Za-z0-9_-]{1,60}$/,TASK_KEY_RE=/^(P\d{1,3}-\d{1,3}|[ct]-[A-Za-z0-9_-]{1,60})$/,DATE_RE=/^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/;
/* D-16：空计划下（或没有未归档的组时）找不到所属组的自定义待办写这个标记。它不合 GROUP_ID_RE，所以 normalizePlan 永远不会接受叫这个 id 的真实组，待办不会悄悄挂到真实的组上；normalize 对已标记的待办不再改组，importProblem 对它放行 */
const GROUP_NONE="-";
const isObj=v=>v!==null&&typeof v==="object"&&!Array.isArray(v);
const DEFAULT_PLAN={v:1,
  presets:{
    lang:["背了二十个单词","看了一集不带字幕的美剧","跟读练习十分钟","读了一篇英文文章","写了一段英文日记"],
    pro:["刷题：","复习：","读文档：","写代码：","整理笔记："],
    fit:["慢跑三十分钟","核心力量训练","拉伸放松","散步一小时","骑行锻炼"],
    job:["改简历：","投递岗位：","练习面试：","浏览招聘信息","联系了一位校友"],
    oth:[]},
  groups:[
    {id:"P1",cat:"语言",name:"英语日常练习",tasks:[
      {id:"P1-1",text:"听力：能完整听懂一段十分钟的新闻广播"},
      {id:"P1-2",text:"口语：能流畅完成一次五分钟的口头陈述"},
      {id:"P1-3",text:"阅读：读完一本适合自己水平的英文短篇小说"},
      {id:"P1-4",text:"写作：写出一封格式规范的英文邮件"},
      {id:"P1-5",text:"完整做完一套英语模拟测试并记录得分"}]},
    {id:"P2",cat:"专业",name:"编程基础复习",note:"复习的顺序是先自己默写，再对照资料查漏，最后用小题目检验。",tasks:[
      {id:"P2-1",text:"变量、类型与表达式"},
      {id:"P2-2",text:"条件分支与循环语句"},
      {id:"P2-3",text:"函数的定义与调用"},
      {id:"P2-4",text:"列表、字典与集合"},
      {id:"P2-5",text:"字符串处理与正则入门"},
      {id:"P2-6",text:"文件读写与异常处理"},
      {id:"P2-7",text:"面向对象的基本概念"},
      {id:"P2-8",text:"递归与简单的排序算法"},
      {id:"P2-9",text:"栈、队列与链表"},
      {id:"P2-10",text:"哈希表与二叉树的基本操作"},
      {id:"P2-11",text:"时间复杂度的估算方法"},
      {id:"P2-12",text:"做完十道综合练习题并整理错题"}]},
    {id:"P3",cat:"专业",name:"从零做完一个小作品",tasks:[
      {id:"P3-1",text:"确定作品的主题与功能清单"},
      {id:"P3-2",text:"画出页面草图和数据结构"},
      {id:"P3-3",text:"搭好项目目录并跑通最小版本"},
      {id:"P3-4",text:"实现核心功能的第一个可用版本"},
      {id:"P3-5",text:"补充错误处理并修正已发现的问题"},
      {id:"P3-6",text:"写一页使用说明"},
      {id:"P3-7",text:"发布到公开地址并请朋友试用"}]},
    {id:"P4",cat:"专业",name:"学完一门在线课程",tasks:[
      {id:"P4-1",text:"看完前三分之一的课程视频"},
      {id:"P4-2",text:"完成前半部分的课后作业"},
      {id:"P4-3",text:"看完全部视频并整理好笔记"},
      {id:"P4-4",text:"提交结课项目并拿到证书"}]},
    {id:"P5",cat:"专业",name:"常用工具与工程习惯",tasks:[
      {id:"P5-1",text:"熟练使用版本控制的提交与分支"},
      {id:"P5-2",text:"在终端里完成日常的文件操作"},
      {id:"P5-3",text:"给自己的代码补上基本的测试"},
      {id:"P5-4",text:"养成写提交说明和更新文档的习惯"}]},
    {id:"P6",cat:"求职",name:"求职准备",tasks:[
      {id:"P6-1",text:"整理一份一页纸的个人简历"},
      {id:"P6-2",text:"列出二十家感兴趣的公司与岗位"},
      {id:"P6-3",text:"准备五个常见行为面试问题的回答"},
      {id:"P6-4",text:"找朋友扮演面试官练一整轮并复盘"},
      {id:"P6-5",text:"每周固定投递并记录进展"}]},
    {id:"P7",cat:"其他",name:"生活事务",tasks:[
      {id:"P7-1",text:"办完一件拖延已久的生活手续"}]}],
  lifts:[
    {id:"bench",n:"卧推",unit:"kg",def:20,target:40,note:"按组记录最大完成重量，动作标准再加重"},
    {id:"squat",n:"深蹲",unit:"kg",def:25,target:50,note:"蹲到大腿与地面平行，稳定后再逐步加重"},
    {id:"dead",n:"硬拉",unit:"kg",def:50,target:100,note:"背部保持平直，每次只小幅增加重量"},
    {id:"pull",n:"引体",unit:"kg",def:4,target:12,note:"记录每组附加的配重，徒手完成时记 0"}],
  fitGoal:[2,4],
  fitNote:"每周固定几个训练日，循序渐进地加重，睡眠和休息同样重要。"};
const pObj=v=>!!v&&typeof v==="object"&&!Array.isArray(v),pStr=v=>typeof v==="string",pNum=v=>typeof v==="number"&&isFinite(v);
/* 只信类型、返回新对象；任何一处不合格就返回 null（拒绝整份计划） */
function normalizePlan(p){
  if(!pObj(p)||!Array.isArray(p.groups)||!Array.isArray(p.lifts)||!pObj(p.presets))return null;
  const gids=new Set(),tids=new Set(),groups=[],lifts=[],presets={};
  for(const g of p.groups){
    if(!pObj(g)||!pStr(g.id)||!GROUP_ID_RE.test(g.id)||gids.has(g.id)||!pStr(g.cat)||!hasCat(g.cat)||!pStr(g.name)||!Array.isArray(g.tasks))return null;
    if(g.note!==undefined&&!pStr(g.note))return null;
    if(g.archived!==undefined&&typeof g.archived!=="boolean")return null;
    gids.add(g.id);
    const tasks=[];
    for(const t of g.tasks){
      if(!pObj(t)||!pStr(t.id)||!PLAN_TASK_ID_RE.test(t.id)||tids.has(t.id)||!pStr(t.text))return null;
      if(t.archived!==undefined&&typeof t.archived!=="boolean")return null;
      tids.add(t.id);
      const o={id:t.id,text:t.text};if(t.archived!==undefined)o.archived=t.archived;tasks.push(o);
    }
    const o={id:g.id,cat:g.cat,name:g.name};if(g.note!==undefined)o.note=g.note;if(g.archived!==undefined)o.archived=g.archived;o.tasks=tasks;groups.push(o);
  }
  const lids=new Set();
  for(const l of p.lifts){
    if(!pObj(l)||!pStr(l.id)||!LIFT_ID_RE.test(l.id)||lids.has(l.id)||!pStr(l.n)||!pStr(l.unit)||!pNum(l.def)||!pNum(l.target)||l.target<=0)return null;
    if(l.note!==undefined&&!pStr(l.note))return null;
    if(l.archived!==undefined&&typeof l.archived!=="boolean")return null;
    lids.add(l.id);const o={id:l.id,n:l.n,unit:l.unit,def:l.def,target:l.target,note:l.note===undefined?"":l.note};if(l.archived!==undefined)o.archived=l.archived;lifts.push(o);
  }
  const keys=CATS.map(c=>c.k);
  for(const k of Object.keys(p.presets)){if(!keys.includes(k)||!Array.isArray(p.presets[k])||!p.presets[k].every(pStr))return null}
  keys.forEach(k=>{presets[k]=(p.presets[k]||[]).slice()});
  if(!Array.isArray(p.fitGoal)||p.fitGoal.length!==2||!p.fitGoal.every(pNum))return null;
  if(p.fitNote!==undefined&&!pStr(p.fitNote))return null;
  return {v:1,presets,groups,lifts,fitGoal:p.fitGoal.slice(),fitNote:p.fitNote===undefined?"":p.fitNote};
}
let plan,planTasks,planIds,planCat,keepOrphans=false;
/* 用 normalizePlan 校验；不合格就回落到 DEFAULT_PLAN；返回传入的计划是否被接受。
   云端路径在返回 false 时把 keepOrphans 设为真：回落的示例计划不是这个账号的真实计划，normalize 不能按它丢进度键（Phase 7 D-08 只对账号真实加载的计划丢孤儿进度） */
function usePlan(p){
  let n=normalizePlan(p);const ok=!!n;if(!n)n=normalizePlan(DEFAULT_PLAN);
  plan=n;planTasks=[];plan.groups.forEach(g=>g.tasks.forEach(t=>planTasks.push({id:t.id,group:g.id,text:t.text})));
  planIds=new Set(planTasks.map(t=>t.id));planCat=Object.fromEntries(plan.groups.map(g=>[g.id,g.cat]));
  return ok;
}
usePlan(DEFAULT_PLAN);
/* D-14、D-03、A17：归档的派生数据按 plan 的对象身份做缓存（archMemo），withPlan 和云端段的 normUnder 换 plan 时不用改；
   组编号 P{n} 只数未归档的组，归档的组显示组名，找不到组显示 T_GROUP_UNKNOWN */
const T_GROUP_UNKNOWN="未知目标组";
function groupLabels(p){const m=new Map();let n=0;p.groups.forEach(g=>m.set(g.id,g.archived?g.name:"P"+(++n)));return m}
let archMemo=null;
function planMeta(){
  if(!archMemo||archMemo.p!==plan)archMemo={p:plan,garch:new Set(plan.groups.filter(g=>g.archived).map(g=>g.id)),arch:new Set(plan.groups.flatMap(g=>g.tasks.filter(t=>t.archived).map(t=>t.id))),label:groupLabels(plan)};
  return archMemo;
}
function groupLabel(id){const m=planMeta().label;return m.has(id)?m.get(id):T_GROUP_UNKNOWN}
function isArchived(t){const m=planMeta();return m.arch.has(t.id)||m.garch.has(t.group)}
function activeTasks(){return allTasks().filter(t=>!isArchived(t))}
function activeGroups(){return plan.groups.filter(g=>!g.archived)}

let state={arrival:"",tasks:{},custom:[],logs:[],lifts:{},reviews:{},presets:{}};
let store=null;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
/* WR-06：格式合格还要是真实存在的日历日期（2026-02-31 经 parse 会变成 03-03，往返不相等） */
const realDate=v=>typeof v==="string"&&DATE_RE.test(v)&&ymd(parse(v))===v;
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const monday=s=>{const d=parse(s);return addDays(s,-((d.getDay()+6)%7))};
const md=s=>(+s.slice(5,7))+"月"+(+s.slice(8))+"日";
const WD="日一二三四五六";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let view=new Date();view.setDate(1);
let sel=today(), wk=monday(today()), wsel=today(), filter="全部";
const compCat={c:"语言",w:"语言"};

function allTasks(){return planTasks.concat(state.custom||[])}
function tstate(id){return state.tasks[id]||{}}

    if(pv.orphans>0){warn.push(lines.length);lines.push(T_IMP_ORPHAN_FILE(pv.orphans))}
    if(pv.orphanCustom>0){warn.push(lines.length);lines.push(T_IMP_ORPHAN_CUSTOM(pv.orphanCustom))}
    lines.push(T_IMP_UNDO_NOTE);
    return {lines,warn};
  }
  if(b.kind===BK_PLAN){
    lines=[T_IMP_KIND_PLAN,T_IMP_REPLACE_PLAN,T_IMP_PLAN(pv.planCounts.groups,pv.planCounts.tasks,pv.planCounts.lifts),T_IMP_NOW(pv.current)];
    if(pv.orphans>0){warn.push(lines.length);lines.push(T_IMP_ORPHAN_PLAN(pv.orphans))}
    if(pv.orphanCustom>0){warn.push(lines.length);lines.push(T_IMP_ORPHAN_CUSTOM(pv.orphanCustom))}
    lines.push(T_IMP_UNDO_NOTE);
    return {lines,warn};
  }

  if(pv.orphans>0){warn.push(lines.length);lines.push(T_IMP_ORPHAN_LEGACY(pv.orphans))}
  if(pv.orphanCustom>0){warn.push(lines.length);lines.push(T_IMP_ORPHAN_CUSTOM(pv.orphanCustom))}

    ${ts.map(x=>row(x,"",x.id)).join("")}</div>`}).join("");
  const alone=solo.length?`<p class="note">${T_ARCH_TASKS}</p>${solo.map(x=>row(x,name.get(x.group)+" · ",x.id)).join("")}`:"";
  return `<details class="arch" id="goalsArch"${goalsArchOpen?" open":""}><summary>已归档（${n}）</summary>${groups}${alone}</details>`;
}

function renderTimeline(){
  const opts=["全部",...CATS.map(c=>c.n),"完成的计划"];
  $("filters").innerHTML=opts.map(o=>`<button aria-pressed="${o===filter}" data-filter="${esc(o)}">${esc(o)}</button>`).join("");
  let items=[];
  if(filter!=="完成的计划")state.logs.filter(l=>filter==="全部"||l.cat===filter).forEach(l=>items.push({date:l.date,text:l.text,tag:l.cat,k:kOf(l.cat),attr:`data-edit="${esc(l.id)}"`}));
  if(filter==="全部"||filter==="完成的计划")allTasks().forEach(t=>{const s=tstate(t.id);if(s.done&&s.doneDate)items.push({date:s.doneDate,text:"完成："+t.text,tag:groupLabel(t.group),k:kOf(planCat[t.group]),attr:`data-edittask="${esc(t.id)}"`})});
  items.sort((a,b)=>b.date.localeCompare(a.date));
  if(!items.length){$("timeline").innerHTML='<p class="empty">还没有内容。在“本周”里写下今天做过的事。</p>';return}
  let html="",m="";
  items.forEach(it=>{const mm=it.date.slice(0,7);if(mm!==m){m=mm;html+=`<div class="tl-month">${esc(mm.slice(0,4))} 年 ${+mm.slice(5)} 月</div>`}
    html+=`<div class="tl-item k-${it.k} editable" ${it.attr} tabindex="0" role="button"><span class="tl-date">${+it.date.slice(5,7)}/${+it.date.slice(8)}</span><span class="tag">${esc(it.tag)}</span><span class="li-text">${esc(it.text)}</span></div>`});
  $("timeline").innerHTML=html;applyGate();
}

/* ---------- events ---------- */
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;
  document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["wk","cal","goal","tl"].forEach(k=>$("tab-"+k).classList.toggle("hidden",k!==b.dataset.tab))});
$("arrival").addEventListener("change",e=>{const v=e.target.value;commit(["arrival"],s=>{s.arrival=v});renderAll()});
function deleteLog(id){takeRemote();const i=state.logs.findIndex(l=>l.id===id);if(i<0){if(remoteView)applyView();return}const gone=JSON.parse(JSON.stringify(state.logs[i]));commit(["log:"+id],s=>{s.logs=s.logs.filter(l=>l.id!==id)});renderAll();
  toast("已删除这条记录",{label:"撤销",fn:()=>{commit(["log:"+id],s=>{if(!s.logs.some(l=>l.id===id))s.logs.splice(Math.min(i,s.logs.length),0,JSON.parse(JSON.stringify(gone)))});renderAll();toast("已恢复")}})}
document.addEventListener("click",e=>{const b=e.target.closest("[data-dellog]");if(!b)return;e.stopImmediatePropagation();e.preventDefault();deleteLog(b.dataset.dellog)},true);
document.addEventListener("click",e=>{if(e.target.closest("dialog"))return;const a=e.target.closest("[data-edit]"),t=e.target.closest("[data-edittask]");
  if(a){e.stopPropagation();openEditor(a.dataset.edit)}else if(t){e.stopPropagation();openTaskEditor(t.dataset.edittask)}},true);
document.addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const el=e.target;if(!el.matches||!el.matches("[data-edit],[data-edittask]"))return;
  e.preventDefault();e.stopPropagation();if(el.dataset.edit)openEditor(el.dataset.edit);else openTaskEditor(el.dataset.edittask)},true);

/* ---------- editor ---------- */
const dlg=$("editor"),form=$("ed-form");
form.addEventListener("submit",e=>e.preventDefault());
function openEditor(id){
  if(document.body.dataset.gate)return;
  const l=state.logs.find(x=>x.id===id);if(!l)return;let cat=l.cat;
  const draw=()=>{form.innerHTML=`<div class="ed-h"><h3 id="ed-title">编辑记录</h3></div>
    <div class="ed-grid">
      <div class="seg" role="group" aria-label="类别">${CATS.map(c=>`<button type="button" class="k-${c.k}" aria-pressed="${c.n===cat}" data-edcat="${esc(c.n)}">${esc(c.n)}</button>`).join("")}</div>
      <label class="f">内容<textarea id="ed-text">${esc(form.dataset.keep!=null?form.dataset.keep:l.text)}</textarea></label>
      <label class="f">日期<input type="date" id="ed-date" value="${esc(form.dataset.kdate||l.date)}"></label>
    </div>
    <div class="ed-foot"><button type="button" class="danger" id="ed-del">删除</button><span class="sp"></span><span class="hint">⌘/Ctrl + Enter 保存</span>
      <button type="button" class="ghost" id="ed-cancel">取消</button><button type="button" class="primary" id="ed-save">保存</button></div>`;
    form.querySelectorAll("[data-edcat]").forEach(b=>b.onclick=()=>{form.dataset.keep=$("ed-text").value;form.dataset.kdate=$("ed-date").value;cat=b.dataset.edcat;draw();$("ed-text").focus()});
    $("ed-cancel").onclick=close;$("ed-del").onclick=()=>{close();deleteLog(id)};
    $("ed-save").onclick=save;
    $("ed-text").addEventListener("keydown",ev=>{if(ev.key==="Enter"&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();save()}});
  };
  const close=()=>{delete form.dataset.keep;delete form.dataset.kdate;dlg.close()};
  const save=()=>{const v=$("ed-text").value.trim(),d=$("ed-date").value;
    if(!v){$("ed-text").focus();toast("内容不能为空，想删掉请点“删除”");return}
    const moved=d&&d!==l.date,nd=d||l.date,nc=cat;close();
    /* D-04 / D-06: a waiting remote version is taken in first, and only then is it asked whether this record still exists; if not, the same save adds it back with the same id and the editor's text, category and date */
    takeRemote();const gone=CLOUD&&!state.logs.some(y=>y.id===id);
    commit(["log:"+id],s=>{const x=s.logs.find(y=>y.id===id);if(x){x.text=v;x.cat=nc;x.date=nd}else s.logs.push({id,date:nd,text:v,cat:nc})});renderAll();
    toast(moved?"已保存，移到 "+md(nd):"已保存");
    if(gone)queueMicrotask(()=>toast(T_LOG_READDED,null,4000))};
  delete form.dataset.keep;delete form.dataset.kdate;draw();dlg.showModal();
  const ta=$("ed-text");ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
}
function openTaskEditor(id){
  if(document.body.dataset.gate)return;
  const t=allTasks().find(x=>x.id===id);if(!t)return;const s=tstate(id);
  form.innerHTML=`<div class="ed-h"><h3 id="ed-title">完成的计划</h3></div>
    <div class="ed-grid"><div class="ed-task"><span class="tag k-${kOf(planCat[t.group])}">${esc(groupLabel(t.group))}</span> ${esc(t.text)}</div>
    <label class="f">完成日期<input type="date" id="ed-date" value="${esc(s.doneDate||today())}"></label></div>
    <div class="ed-foot"><button type="button" class="danger" id="ed-undone">标记为未完成</button><span class="sp"></span>
      <button type="button" class="ghost" id="ed-cancel">取消</button><button type="button" class="primary" id="ed-save">保存</button></div>`;
  $("ed-cancel").onclick=()=>dlg.close();
  $("ed-undone").onclick=()=>{dlg.close();commit(["task:"+id],st=>{st.tasks[id]=Object.assign({},st.tasks[id]||{},{done:false,doneDate:""})});renderAll();toast("已改回未完成")};
  $("ed-save").onclick=()=>{const d=$("ed-date").value;dlg.close();if(d)commit(["task:"+id],st=>{st.tasks[id]=Object.assign({},st.tasks[id]||{},{doneDate:d})});renderAll();toast("已保存")};
  dlg.showModal();
}
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
dlg.addEventListener("close",()=>{if(remoteView)maybeApplyView()});

/* ---------- drag to another day ---------- */
let dragId=null;
$("days").addEventListener("dragstart",e=>{const el=e.target.closest&&e.target.closest("[data-edit]");if(!el)return;dragId=el.dataset.edit;el.classList.add("dragging");
  try{e.dataTransfer.setData("text/plain",dragId);e.dataTransfer.effectAllowed="move"}catch(_){}});
$("days").addEventListener("dragend",e=>{dragId=null;document.querySelectorAll(".dragging,.drop").forEach(x=>x.classList.remove("dragging","drop"))});
$("days").addEventListener("dragover",e=>{if(!dragId)return;const d=e.target.closest("[data-wday]");if(!d)return;e.preventDefault();
  document.querySelectorAll(".day.drop").forEach(x=>x!==d&&x.classList.remove("drop"));d.classList.add("drop")});
$("days").addEventListener("drop",e=>{const d=e.target.closest("[data-wday]");if(!d||!dragId)return;e.preventDefault();
  const l=state.logs.find(x=>x.id===dragId);dragId=null;if(!l||l.date===d.dataset.wday){renderWeek();return}
  const lid=l.id,nd=d.dataset.wday;commit(["log:"+lid],s=>{const x=s.logs.find(y=>y.id===lid);if(x)x.date=nd});renderAll();toast("已移到 "+md(nd))});
// week
$("wkPrev").onclick=()=>{wk=addDays(wk,-7);wsel=wk;renderWeek()};
$("wkNext").onclick=()=>{wk=addDays(wk,7);wsel=wk;renderWeek()};
$("wkNow").onclick=()=>{wk=monday(today());wsel=today();renderWeek()};
function pickDay(el){if(!el)return;wsel=el.dataset.wday;renderWeek();if(innerWidth<=900)$("wkComp").scrollIntoView({behavior:"smooth",block:"start"})}
$("days").addEventListener("click",e=>{if(e.target.closest(".x"))return;pickDay(e.target.closest("[data-wday]"))});
$("days").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset.wday){e.preventDefault();pickDay(e.target)}});
let rvT,rvJob=null;$("review").addEventListener("input",e=>{clearTimeout(rvT);const v=e.target.value,w=wk;rvPending=true;rvJob=()=>{rvJob=null;rvPending=false;commit(["review:"+w],s=>{if(v.trim())s.reviews[w]=v;else delete s.reviews[w]})};rvT=setTimeout(rvJob,800)});
// calendar
$("prev").onclick=()=>{view.setMonth(view.getMonth()-1);renderCal()};
$("next").onclick=()=>{view.setMonth(view.getMonth()+1);renderCal()};
$("todayBtn").onclick=()=>{view=new Date();view.setDate(1);sel=today();renderCal();renderDay()};
$("grid").addEventListener("click",e=>{const c=e.target.closest("[data-date]");if(!c)return;sel=c.dataset.date;
  const d=parse(sel);if(d.getMonth()!==view.getMonth()||d.getFullYear()!==view.getFullYear()){view=new Date(d);view.setDate(1)}renderCal();renderDay()});
// goals
$("goals").addEventListener("toggle",e=>{if(e.target&&e.target.id==="goalsArch")goalsArchOpen=e.target.open},true);
$("goals").addEventListener("change",e=>{
  const c=e.target.dataset.task,du=e.target.dataset.due;
  if(c){const on=e.target.checked,day=today();commit(["task:"+c],st=>{st.tasks[c]=Object.assign({},st.tasks[c]||{},{done:on,doneDate:on?day:""})});renderAll();if(on)toast("完成，已记到今天")}
  if(du){const v=e.target.value;commit(["task:"+du],st=>{st.tasks[du]=Object.assign({},st.tasks[du]||{},{due:v})});renderAll()}
});
function saveLift(lf){const inp=$("lf-"+lf);if(!inp)return;const v=parseFloat(inp.value);const L=plan.lifts.find(x=>x.id===lf);const s=lift(lf);
  if(isNaN(v)||v<0){renderGoals();return}
  if(v===s.cur){renderGoals();return}
  const day=today();
  commit(["lift:"+lf],st=>{const c=Object.assign({cur:L.def,hist:[]},st.lifts[lf]||{});const h=c.hist.slice();if(h.length&&h[h.length-1].date===day)h[h.length-1]={date:day,v};else h.push({date:day,v});st.lifts[lf]=Object.assign(c,{cur:v,hist:h.slice(-30)})});renderGoals();toast(v>=L.target?L.n+"达标了":L.n+"已更新为 "+v+L.unit)}
$("goals").addEventListener("input",e=>{const lf=e.target.dataset.lift;if(!lf)return;const b=document.querySelector(`[data-liftsave="${lf}"]`);
  if(b)b.classList.toggle("hidden",parseFloat(e.target.value)===lift(lf).cur)});
function addTask(g){const inp=document.querySelector(`[data-addto="${g}"]`);const v=inp.value.trim();if(!v)return;const id="c-"+uid();commit(["custom:"+id],s=>{if(!s.custom.some(x=>x.id===id))s.custom.push({id,group:g,text:v})});renderAll()}
$("goals").addEventListener("click",e=>{const a=e.target.dataset.addbtn,d=e.target.dataset.deltask,ls=e.target.dataset.liftsave;if(ls)saveLift(ls);
  if(a)addTask(a);if(d){commit(["custom:"+d],s=>{s.custom=s.custom.filter(t=>t.id!==d);delete s.tasks[d]});renderAll()}});
$("goals").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.addto)addTask(e.target.dataset.addto);if(e.key==="Enter"&&e.target.dataset.lift){e.preventDefault();saveLift(e.target.dataset.lift)}});
$("filters").addEventListener("click",e=>{const b=e.target.closest("[data-filter]");if(!b)return;filter=b.dataset.filter;renderTimeline()});

/* ---------- export / import ---------- */
/* B7: 日历工具可能把以 = + - @、制表符、回车开头的单元格当公式执行，这样的单元格前面多一个英文单引号，然后才按逗号、引号、换行、回车加引号。不加 BOM。 */
function csvCell(s){s=String(s);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function usDate(s){return s.slice(5,7)+"/"+s.slice(8)+"/"+s.slice(0,4)}
/* 三个下载（备份、日历 CSV、下载留底）共用的浏览器原生下载：Blob 加临时 <a download>。对象地址必须比这次点击活得久（浏览器可能还在问用户是否允许下载），所以 30 秒后才 revoke；抛错时 revoke 已建的地址并返回 false */
function blobDownload(name,text,type){
  let url=null;
  try{
    url=URL.createObjectURL(new Blob([text],{type}));
    const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  }catch(e){
    if(url)try{URL.revokeObjectURL(url)}catch(x){}
    return false;
  }
  setTimeout(()=>URL.revokeObjectURL(url),30000);
  return true;
}
/* note: shown instead of the plain "已导出" (and for longer) when the file has something the user should know; a failed download still says it is unavailable */
const T_EXPORT_SAMPLE_PLAN="已导出。账号的计划读不出来，备份里的计划是示例计划，导入它会换掉账号的计划。";
function saveFile(name,text,type,note){const ok=blobDownload(name,text,type);if(ok&&note)toast(note,null,6000);else toast(ok?"已导出":"导出不可用")}
$("exportCsv").onclick=()=>{
  if(remoteView)applyView();
  const rows=[["Subject","Start Date","All Day Event","Description"]];
  state.logs.forEach(l=>rows.push(["["+l.cat+"] "+l.text.split("\n")[0].slice(0,80),usDate(l.date),"True",l.text]));
  allTasks().forEach(t=>{const s=tstate(t.id);
    if(s.done&&s.doneDate)rows.push(["完成："+t.text,usDate(s.doneDate),"True",groupLabel(t.group)+" 计划"]);
    else if(s.due)rows.push(["截止："+t.text,usDate(s.due),"True",groupLabel(t.group)+" 计划"])});
  if(rows.length===1){toast("还没有可导出的日期");return}
  saveFile("计划手记-日历.csv",rows.map(r=>r.map(csvCell).join(",")).join("\n"),"text/csv;charset=utf-8");
};
/* 备份是新格式完整备份（D-10：旧路径也一样）；有别的设备的更新正等着显示时先按 Phase 10 的规则应用，文件与账号当前数据一致 */
$("exportJson").onclick=()=>{
  if(remoteView)applyView();
  /* keepOrphans: the account plan could not be read and plan is the sample plan, so the file says "full backup" with a plan that is not the account's (IN-05) */
  saveFile("计划手记-备份-"+today()+".json",JSON.stringify(backupOf(plan,state,new Date().toISOString()),null,2),"application/json",keepOrphans?T_EXPORT_SAMPLE_PLAN:undefined);
};
$("importBtn").onclick=()=>$("importJson").click();
$("importJson").addEventListener("change",e=>{onImportFile(e.target)});

let tt;function toast(m,act,ms){const t=$("toast");if(ms!=null)t.setAttribute("data-cloud","");else t.removeAttribute("data-cloud");t.textContent="";const s=document.createElement("span");s.textContent=m;t.appendChild(s);
  t.classList.toggle("act",!!act);
  if(act){const b=document.createElement("button");b.type="button";b.textContent=act.label;b.onclick=()=>{clearTimeout(tt);t.classList.remove("on","act");act.fn()};t.appendChild(b)}
  t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on","act"),ms!=null?ms:act?5000:1800)}
window.addEventListener("pagehide",flush);
init();
})();
