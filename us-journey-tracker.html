<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>计划手记</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
<meta name="theme-color" content="#1B2740">
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --paper:#F2F5F9; --surface:#FFFFFF; --ink:#1B2740; --muted:#5E6B82; --line:#D9E0EA; --red:#B4423A;
  --c-lang:#0E7C7B; --c-lang-s:#DCEFEE;
  --c-pro:#3D5BC4; --c-pro-s:#E2E8FA;
  --c-fit:#C2522D; --c-fit-s:#F8E3DA;
  --c-job:#A87000; --c-job-s:#F6ECD2;
  --c-oth:#6B7385; --c-oth-s:#E6E9EF;
  --today:#1B2740; --today-ink:#FFFFFF;
  --serif:"Songti SC","STSong",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121826; --surface:#1A2234; --ink:#E6EBF4; --muted:#98A3B8; --line:#2C3650; --red:#E07A70;
    --c-lang:#4FC1BF; --c-lang-s:#16393B; --c-pro:#8FA6F2; --c-pro-s:#232E52;
    --c-fit:#EE8B66; --c-fit-s:#41261C; --c-job:#E2A93B; --c-job-s:#3A2E16; --c-oth:#A3ABBD; --c-oth-s:#2A3146;
    --today:#E6EBF4; --today-ink:#121826; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121826; --surface:#1A2234; --ink:#E6EBF4; --muted:#98A3B8; --line:#2C3650; --red:#E07A70;
  --c-lang:#4FC1BF; --c-lang-s:#16393B; --c-pro:#8FA6F2; --c-pro-s:#232E52;
  --c-fit:#EE8B66; --c-fit-s:#41261C; --c-job:#E2A93B; --c-job-s:#3A2E16; --c-oth:#A3ABBD; --c-oth-s:#2A3146;
  --today:#E6EBF4; --today-ink:#121826; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c-lang);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 48px}
.k-lang{--c:var(--c-lang);--s:var(--c-lang-s)} .k-pro{--c:var(--c-pro);--s:var(--c-pro-s)}
.k-fit{--c:var(--c-fit);--s:var(--c-fit-s)} .k-job{--c:var(--c-job);--s:var(--c-job-s)} .k-oth{--c:var(--c-oth);--s:var(--c-oth-s)}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.title h1{font-family:var(--serif);font-weight:800;font-size:clamp(26px,4vw,34px);margin:0;letter-spacing:.02em}
.title p{margin:4px 0 0;color:var(--muted)}
.counter{display:flex;align-items:baseline;gap:10px}
.counter .n{font-family:var(--serif);font-weight:800;font-size:clamp(44px,8vw,64px);line-height:1;color:var(--c-lang)}
.counter .lbl{color:var(--muted)}
.arrival{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-top:6px}
.arrival input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px}

nav.tabs{display:flex;gap:4px;margin:20px 0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav.tabs button{background:none;border:0;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.toolbar{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;align-items:center;padding-bottom:6px}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
#snapshotBtn,#undoImportBtn{color:var(--ink);background:var(--c-job-s);border-color:var(--c-job);font-size:12px}
#logoutBtn,.who{font-size:12px}
.who{color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.who{display:none}}
.icon{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.primary{background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:7px 14px;font-weight:600}
.primary:disabled{opacity:.4;cursor:default}
select,input[type=date],input[type=text],input[type=number],textarea{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--paper)}
.empty{color:var(--muted);font-size:14px;padding:6px 0;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.hidden{display:none !important}

/* week */
.wk-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.wk-head h2{font-family:var(--serif);font-size:24px;margin:0}
.wk-head .range{color:var(--muted)}
.wk-head .nav{margin-left:auto;display:flex;gap:6px}
.areas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
@media (max-width:720px){.areas{grid-template-columns:repeat(3,minmax(0,1fr))}}
.area{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:10px 12px}
.area .nm{font-size:13px;color:var(--muted)}
.area .v{font-family:var(--serif);font-weight:800;font-size:26px;line-height:1.2;color:var(--c)}
.area .v small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}
.area .goal{font-size:12px;color:var(--muted)}
.area .goal.ok{color:var(--c)}
.wk-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.wk-layout{grid-template-columns:1fr}}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media (max-width:900px){.days{grid-template-columns:1fr}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:170px;display:flex;flex-direction:column;gap:5px;text-align:left}
@media (max-width:900px){.day{min-height:0}}
.day.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day .dh{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--muted)}
.day .dh b{font-size:16px;color:var(--ink)}
.day.today .dh b{background:var(--today);color:var(--today-ink);border-radius:6px;padding:0 6px}
.ent{font-size:12.5px;line-height:1.4;background:var(--s);color:var(--ink);border-left:3px solid var(--c);border-radius:4px;padding:3px 6px;word-break:break-word;display:flex;gap:4px;align-items:flex-start}
.ent span{flex:1;min-width:0}
.ent.done{background:transparent;color:var(--muted)}
.ent[data-edit],.ent[data-edittask]{cursor:pointer}
.ent[data-edit]:hover,.ent[data-edittask]:hover{filter:brightness(.97);box-shadow:0 0 0 1px var(--c)}
.ent.dragging{opacity:.4}
.day.drop{border-color:var(--c-pro);box-shadow:inset 0 0 0 2px var(--c-pro)}
.editable{cursor:pointer}
.editable:hover{box-shadow:0 0 0 1px var(--c)}
.x{background:none;border:0;color:var(--muted);font-size:15px;line-height:1;padding:0 2px}
.x:hover{color:var(--red)}
.review{margin-top:18px}
.review h3,.side h3{font-family:var(--serif);font-size:18px;margin:0 0 4px}
.review p.sub,.side p.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.review textarea{width:100%;min-height:90px;resize:vertical;background:var(--paper)}

/* composer */
.comp{display:grid;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{border:1px dashed var(--c);background:var(--s);color:var(--c);border-radius:6px;padding:3px 9px;font-size:12.5px}
.presets .hint{font-size:12px;color:var(--muted);width:100%}
.pchip{display:inline-flex;align-items:stretch}
.pchip.editing button[data-preset]{border-style:solid;border-radius:6px 0 0 6px;cursor:default;opacity:.75}
.presets .pdel{border:1px solid var(--c);border-left:0;border-radius:0 6px 6px 0;background:var(--surface);color:var(--red);padding:0 7px;font-size:14px;line-height:1}
.presets .plus{border:1px dashed var(--line);background:none;color:var(--muted)}
.presets .plus:hover{color:var(--ink);border-color:var(--muted)}
.presets .pedit{border:0;background:none;color:var(--muted);text-decoration:underline;padding:3px 4px}
.presets .padd{width:150px;padding:3px 8px;font-size:12.5px;border-radius:6px;border:1px solid var(--c);background:var(--surface)}
.comp textarea{width:100%;min-height:64px;resize:vertical}
.comp .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.comp .when{font-size:13px;color:var(--muted)}

/* calendar */
.cal-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:24px;align-items:start}
@media (max-width:820px){.cal-layout{grid-template-columns:1fr}}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h2{font-family:var(--serif);font-size:22px;margin:0}
.cal-head .nav{display:flex;gap:6px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cell{position:relative;min-height:82px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 6px 5px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cell.out{opacity:.38}
.cell.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cell .d{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cell.today .d{background:var(--today);color:var(--today-ink)}
.cell.arr::after{content:"抵美";position:absolute;top:6px;right:6px;font-size:10px;color:var(--c-lang);border:1px solid var(--c-lang);border-radius:4px;padding:0 3px}
.chips{display:flex;flex-direction:column;gap:2px}
.chip{font-size:11px;line-height:1.35;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--s);color:var(--c)}
.chip.due{background:transparent;border:1px dashed var(--c-job);color:var(--c-job)}
.chip.done{background:transparent;color:var(--muted);text-decoration:line-through}
.more{font-size:11px;color:var(--muted)}
@media (max-width:560px){
  .cell{min-height:54px;padding:4px}
  .chips{flex-direction:row;flex-wrap:wrap;gap:3px}
  .chip{font-size:0;height:7px;width:7px;padding:0;border-radius:50%;background:var(--c)}
  .chip.due{background:transparent;border-color:var(--c-job)} .chip.done{background:var(--muted)}
  .more,.cell.arr::after{display:none}
}
.sect{font-size:13px;color:var(--muted);margin:14px 0 6px}
ul.items{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.items li{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:8px;background:var(--paper)}
.tag{flex:none;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--s);color:var(--c);margin-top:2px;max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-text{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.panel h3{font-family:var(--serif);font-size:19px;margin:0}
.panel .sub{color:var(--muted);font-size:13px;margin:2px 0 14px}

/* goals */
.goals{display:grid;gap:18px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.group-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.group-h .p{font-family:var(--serif);font-weight:800;color:var(--c);font-size:18px}
.group-h h3{margin:0;font-size:17px}
.group-h .cnt{margin-left:auto;color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted);margin:4px 0 0}
.bar{height:4px;background:var(--line);border-radius:2px;margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:2px;transition:width .3s}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.task input[type=checkbox]{width:18px;height:18px;accent-color:var(--c)}
.task.isdone .tt{color:var(--muted);text-decoration:line-through}
.task .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.task .meta input[type=date]{font-size:12px;padding:3px 5px}
.task .od{color:var(--red)}
.task .sub-h{font-size:12px;color:var(--c);font-weight:600}
@media (max-width:560px){.task{grid-template-columns:auto 1fr}.task .meta{grid-column:2}}
.addtask{display:flex;gap:8px;margin-top:10px}
.addtask input{flex:1;min-width:0}
.lifts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.lift{background:var(--paper);border-radius:10px;padding:12px}
.lift .ln{font-size:14px;font-weight:600}
.lift .lv{font-family:var(--serif);font-weight:800;font-size:28px;color:var(--c);line-height:1.2}
.lift .lv small{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--muted)}
.lift .lbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}
.lift .lbar i{display:block;height:100%;background:var(--c)}
.lift .upd{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.lift .upd input{width:80px;padding:4px 6px}
.lift .hist{font-size:12px;color:var(--muted);margin-top:6px}
/* Phase 12：目标页「已归档」区，只在 .arch 里生效，主列表里的同名组件不变 */
.arch .group{padding:16px} .arch .group-h{gap:8px} .arch .group-h h3{font-size:16px;font-weight:600}
.arch .group-h .cnt,.arch .note,.arch .task .meta,.arch .lift .hist,.arch .lift .lv small{font-size:12px;font-weight:400}
.arch .task{gap:8px} .arch .task .meta{gap:8px} .arch .task .tt{font-size:14px;font-weight:400}
.arch .bar{margin:8px 0} .arch .lift .ln{font-size:14px;font-weight:600}
.arch .lift .lv{font-size:16px;font-weight:600}
.arch>summary{min-height:36px;padding:8px 0;font-size:14px;color:var(--muted);cursor:pointer}
.group.arch-g,.lift.arch-l{--c:var(--c-oth);--s:var(--c-oth-s);color:var(--muted)}
/* Phase 12 UI 审查修复（12-UI-REVIEW）：编辑页选中的类别按钮用浅底、正文色文字和类别色边框；编辑页和「已归档」区的禁用按钮变淡、不显示手型、悬停不变色；「已归档」区的删除按钮放大点击区域 */
#tab-plan .seg button[aria-pressed="true"]{background:var(--s);color:var(--ink);border-color:var(--c)}
#tab-plan button:disabled,.arch button:disabled{opacity:.4;cursor:not-allowed}
#tab-plan .ghost:disabled:hover,.arch .ghost:disabled:hover{color:var(--muted);border-color:var(--line)} #tab-plan .danger:disabled:hover,.arch .danger:disabled:hover{border-color:var(--line)}
.arch .x{font-size:16px;min-width:36px;min-height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center}
@media (max-width:560px){.arch .x{min-width:44px;min-height:44px}}
.arch-mark{font-size:12px;padding:0 8px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.task.ro{grid-template-columns:1fr auto}
/* Phase 12：编辑计划页。只在下面的作用域里生效，不改现有视图；全局的 .ghost/.primary/.danger/.panel/.seg/.empty/dialog#confirm 规则不动，作用域覆盖把新界面放到 4 的倍数网格和 12/14/16/24 字号上 */
:is(#tab-plan,.goals-bar,.pe-empty,.arch,dialog#confirm.pe) :is(.ghost,.danger){padding:8px 12px;font-size:14px}
:is(#tab-plan,.pe-empty,dialog#confirm.pe) .primary{padding:8px 16px;font-size:14px}
#tab-plan .panel{padding:16px}
#tab-plan .seg{gap:8px} #tab-plan .seg button{padding:8px 12px;font-size:14px}
#tab-plan .empty,.pe-empty .empty{padding:8px 0}
dialog#confirm.pe{padding:24px}
dialog#confirm.pe #cf-body p+p{margin-top:8px}
@media (max-width:560px){dialog#confirm.pe{padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px))}}
dialog#confirm #cf-body{max-height:50vh;overflow:auto}
dialog#confirm .ed-foot.three{flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){dialog#confirm .ed-foot.three{flex-direction:column;align-items:stretch}dialog#confirm .ed-foot.three button{flex:none;width:100%;min-height:44px}}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#tab-plan{max-width:800px;margin:0 auto;padding-bottom:32px}
#tab-plan .pe-head h2{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.2;margin:0}
#tab-plan .pe-head p{font-size:14px;color:var(--muted);margin:8px 0 0}
#pe-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;display:flex;align-items:center;gap:12px;margin:16px 0;padding:12px 0;background:var(--paper);border-bottom:1px solid var(--line)}
#pe-bar button{flex:none;white-space:nowrap}
#pe-hint{flex:1 1 auto;min-width:0;margin:0;font-size:12px;line-height:1.55;color:var(--muted)}
#pe-hint[data-tone]::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tone,var(--muted));margin-right:8px}
#pe-hint[data-tone="warn"]{--tone:var(--c-job)} #pe-hint[data-tone="error"]{--tone:var(--red)}
#pe-save[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
#pe-notice,#pe-unread{margin:0 0 16px}
.pe-sec{margin-top:24px}
.pe-sec>h3{display:flex;align-items:baseline;gap:8px;font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.2;margin:0 0 8px}
.pe-count,.pe-sec .sub,.pe-sum,.pe-lim{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--muted)}
.pe-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:12px;margin-bottom:8px}
.pe-card-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px}
.pe-toggle{flex:1 1 160px;min-width:0;display:flex;align-items:baseline;gap:8px;min-height:36px;padding:0;background:none;border:0;text-align:left;color:var(--ink);font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.2}
.pe-toggle .pe-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pe-chev::before{content:"▸"} .pe-toggle[aria-expanded="true"] .pe-chev::before{content:"▾"}
.pe-bad{font-size:12px;color:var(--red)}
.pe-body{padding:0 16px 16px}
.pe-body[hidden]{display:none}
.pe-body label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);margin-bottom:12px}
#tab-plan :is(input[type=text],input[type=number],textarea){font-size:16px;line-height:1.55;width:100%;min-width:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
#tab-plan [aria-invalid="true"]{border-color:var(--red)}
#tab-plan .tagpill{background:var(--s);color:var(--ink)}
.pe-rows{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pe-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:start}
.pe-row .pe-n{font-size:12px;color:var(--muted);padding-top:12px;text-align:right}
.pe-act{display:flex;gap:4px}
#tab-plan .pe-act button{font-size:12px;min-height:36px;padding:4px 8px}
.pe-err{grid-column:2 / -1;margin:0;font-size:12px;color:var(--red)}
.pe-body .seg{margin-bottom:12px}
.pe-sub{display:flex;align-items:baseline;gap:8px;font-size:12px;font-weight:400;color:var(--muted);margin:4px 0 8px}
#tab-plan textarea{min-height:64px;resize:vertical}
.pe-add{margin-top:8px}
.pe-add+.pe-add{margin-left:8px}
#tab-plan [hidden]{display:none}
.pe-body>.pe-err{margin:-8px 0 12px}
.pe-cnt{display:block;text-align:right;font-size:12px;color:var(--muted)}
.pe-row .pe-cnt,.pe-row .pe-err{grid-column:2 / -1}
.pe-lim{margin-left:8px}
#tab-plan .panel h4.pe-panel-t{font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.2;margin:0 0 12px}
.pe-fit{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:12px}
.pe-fitf{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.pe-fitf .pe-in{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
#tab-plan .pe-fitf input{width:96px}
.pe-fitf .pe-err{grid-column:auto;max-width:200px}
.pe-eg{font-size:12px;color:var(--muted)}
.pe-note{font-size:12px;color:var(--muted);margin:0 0 12px}
.panel.pe-empty{padding:24px}
.panel.pe-empty h3{font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.2;margin:0 0 8px}
.pe-empty p{font-size:14px;margin:0 0 16px}
.pe-empty-act{display:flex;flex-wrap:wrap;gap:8px}
.goals-bar{display:flex;justify-content:flex-end;margin-bottom:12px}
/* Phase 12-06：编辑页「已归档」区（S13），只在 #pe-archived 里生效 */
#pe-archived{margin-top:24px}
#pe-archived>summary{min-height:36px;padding:8px 0;font-size:14px;color:var(--muted);cursor:pointer}
#pe-archived .pe-arch-h{font-size:12px;font-weight:400;color:var(--muted);margin:12px 0 4px}
#pe-archived .pe-arch-list{list-style:none;margin:0;padding:0}
#pe-archived .pe-arch-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
#pe-archived .pe-arch-txt{min-width:0}
#pe-archived .pe-arch-name,#pe-archived .pe-arch-desc{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pe-archived .pe-arch-name{font-size:14px;line-height:1.55}
#pe-archived .pe-arch-desc{font-size:12px;color:var(--muted)}
#pe-archived .pe-arch-lim{grid-column:1 / -1;margin:0;font-family:var(--sans);font-size:12px;font-weight:400;color:var(--muted)}
@media (max-width:560px){
  #tab-plan :is(input,textarea,.seg button,.pe-toggle),#tab-plan .pe-act button,#pe-bar button,#planEditBtn,.pe-empty-act button{min-height:44px}
  .pe-row{grid-template-columns:24px minmax(0,1fr)}
  .pe-act{grid-column:2}#tab-plan .pe-act button{flex:1}
  .pe-empty-act button{flex:1 1 100%}
  #pe-archived .pe-arch-row .pe-act{grid-column:1 / -1}
}

/* Phase 14. Scoped to .pe-empty / dialog#sample / #tab-plan .pe-tools; no global rule changes. No inline style attributes anywhere (CSP style-src-attr none). */
/* S1: empty-plan card buttons (real disabled from the global gate and aria-disabled from offline/expired look the same) */
.pe-empty-act :is(button:disabled,[aria-disabled="true"]){opacity:.4;cursor:not-allowed}
.pe-empty-act .ghost:is(:disabled,[aria-disabled="true"]):hover{color:var(--muted);border-color:var(--line)}
.pe-empty-act .pe-why{flex:1 1 100%;margin:0;font-size:12px;line-height:1.55;color:var(--muted)}
.pe-empty-act .pe-why:empty{display:none}
.pe-empty-act .pe-why::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c-job);margin-right:8px}
/* S4: editor entry row */
#tab-plan .pe-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 16px}
#tab-plan .pe-tools-note{font-size:12px;line-height:1.55;color:var(--muted)}
/* S2: picker dialog (backdrop: dialog#sample::backdrop is in the dialog#editor/#confirm backdrop selector) */
dialog#sample{border:1px solid var(--line);border-radius:14px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);background:var(--surface);color:var(--ink);font-size:14px;line-height:1.55}
dialog#sample[open]{display:flex;flex-direction:column}
dialog#sample form{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
dialog#sample :is(.ghost,.danger){padding:8px 12px;font-size:14px}
dialog#sample .primary{padding:8px 16px;font-size:14px}
.pk-head{padding:24px 24px 0}
.pk-head h3{font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.2;margin:0}
.pk-head p{margin:8px 0 0;font-size:14px;color:var(--muted)}
.pk-body{flex:1 1 auto;min-height:0;overflow:auto;margin-top:16px;padding:16px 24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pk-sec{border:0;margin:0;padding:0;min-width:0}
.pk-sec+.pk-sec{margin-top:24px}
.pk-sec legend{padding:0;margin-bottom:8px;font-size:12px;font-weight:600;color:var(--muted)}
.pk-sec legend .pe-count{margin-left:8px;font-weight:400}
.pk-lim{margin:0 0 8px}
.pk-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pk-item{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:start;min-height:36px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;cursor:pointer}
.pk-item:has(input:checked){background:var(--s);border-color:var(--c)}
.pk-item:has(input:focus-visible){outline:2px solid var(--c-lang);outline-offset:2px}
.pk-item:has(input:disabled){opacity:.4;cursor:not-allowed}
.pk-item input{width:20px;height:20px;margin:0;accent-color:var(--ink)}
.pk-name{display:block;font-size:14px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.pk-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;font-size:12px;font-weight:400;color:var(--muted)}
.pk-chip{padding:0 8px;border:1px solid var(--c);border-radius:999px;color:var(--ink)}
.pk-dup{padding:0 8px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.pk-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:16px 24px 24px}
#pk-hint{flex:1 1 160px;min-width:0;margin:0;font-size:12px;line-height:1.55;color:var(--muted)}
#pk-hint[data-tone]::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tone,var(--muted));margin-right:8px}
#pk-hint[data-tone="warn"]{--tone:var(--c-job)} #pk-hint[data-tone="error"]{--tone:var(--red)}
.pk-foot button{min-height:36px}
.pk-foot :is(button:disabled,[aria-disabled="true"]){opacity:.4;cursor:not-allowed}
.pk-foot .ghost:is(:disabled,[aria-disabled="true"]):hover{color:var(--muted);border-color:var(--line)}
@media (max-width:560px){
  dialog#sample{margin:auto 0 0;width:100vw;max-width:100vw;max-height:90vh;max-height:90dvh;border-radius:14px 14px 0 0}
  .pk-item{min-height:44px}
  .pk-foot{padding:16px 24px calc(24px + env(safe-area-inset-bottom,0px))}
  #pk-hint{flex:1 1 100%}
  .pk-foot button{flex:1;min-height:44px}
  dialog#sample .pk-foot button{padding-left:12px;padding-right:12px}
  #tab-plan .pe-tools .ghost{flex:1 1 100%;min-height:44px}
}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-month{font-family:var(--serif);font-size:18px;margin:22px 0 8px}
.tl-month:first-child{margin-top:0}
.tl-item{position:relative;padding:8px 12px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;gap:10px;align-items:flex-start}
.tl-item::before{content:"";position:absolute;left:-21px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--c);border:2px solid var(--paper)}
.tl-date{flex:none;font-size:13px;color:var(--muted);width:48px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.status{font-size:12px;color:var(--muted);margin-top:28px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5;display:flex;gap:14px;align-items:center}
.toast.on{opacity:1}
.toast.act{pointer-events:auto}
.toast button{background:none;border:0;color:var(--c-lang-s);font-weight:700;padding:0;text-decoration:underline}
.toast[data-cloud] button{font-weight:600;flex:none}
.toast[data-cloud]{width:max-content;max-width:calc(100vw - 32px)}
body[data-gate] :is(button,input,select,textarea):disabled{opacity:.55;cursor:not-allowed}
body[data-gate] .primary:disabled{opacity:.4}
body[data-gate] .ghost[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
body[data-gate] [aria-disabled="true"]{cursor:default}
body[data-gate] .ent[aria-disabled="true"]:hover,body[data-gate] .editable[aria-disabled="true"]:hover{filter:none;box-shadow:none}
dialog#editor,dialog#confirm{border:1px solid var(--line);border-radius:14px;padding:20px;width:min(460px,calc(100vw - 24px));background:var(--surface);color:var(--ink)}
dialog#editor::backdrop,dialog#confirm::backdrop,dialog#sample::backdrop{background:rgba(10,16,30,.45)}
@media (max-width:560px){dialog#editor,dialog#confirm{margin:auto 0 0;width:100vw;max-width:100vw;border-radius:14px 14px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
dialog#confirm .ed-h h3{font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.2}
#cf-body{font-size:14px;word-break:break-word}
#cf-body p{margin:0}
#cf-body p+p{margin-top:6px}
#cf-body p.cf-who{color:var(--muted)}
#cf-body p.cf-warn{color:var(--ink);background:var(--c-job-s);border-left:3px solid var(--c-job);padding:6px 10px;border-radius:6px}
@media (max-width:560px){dialog#confirm .ed-foot .sp{display:none}dialog#confirm .ed-foot button{flex:1;min-height:44px}}
.ed-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.ed-h h3{font-family:var(--serif);font-size:19px;margin:0}
.ed-grid{display:grid;gap:12px}
.ed-grid label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.ed-grid textarea{width:100%;min-height:96px;resize:vertical;color:var(--ink)}
.ed-task{padding:10px 12px;background:var(--paper);border-radius:8px}
.ed-foot{display:flex;gap:8px;align-items:center;margin-top:16px}
.ed-foot .sp{flex:1}
.ed-foot .hint{font-size:12px;color:var(--muted)}
@media (max-width:560px){.ed-foot .hint{display:none}}
.danger{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--red)}
.danger:hover{border-color:var(--red)}
/* login */
:is(#login,#boot,dialog#confirm){font-size:14px;line-height:1.55}
:is(#syncbar,#boot,dialog#confirm) button{font-size:14px}
#login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px max(20px,env(safe-area-inset-right)) 48px max(20px,env(safe-area-inset-left))}
@media (min-width:561px){#login{padding-top:64px;padding-bottom:64px}}
#login h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,4vw,34px);line-height:1.2;margin:0;text-align:center}
#login .lead{color:var(--muted);text-align:center;margin:8px 0 24px}
.gate-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
#login label.f{display:block;margin:0 0 4px}
#login input{font-size:16px;line-height:1.55;width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--paper)}
#login .pw-row{position:relative}
#login .pw-row input{padding-right:64px}
#login .pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px}
#login #loginForm>input{margin-bottom:16px}
#login button{font-size:14px}
#login .primary{width:100%}
#login-err{color:var(--red);margin:8px 0 0;overflow-wrap:anywhere}
#login-err:empty{display:none}
#login #login-err+.primary{margin-top:16px}
#login .fine{font-size:12px;color:var(--muted);text-align:center;margin:16px 0 0}
@media (max-width:560px){#login input,#login .primary{min-height:44px}}
/* status dot and sync bar */
.status[data-state]::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tone,var(--muted));margin-right:8px}
.status[data-state="synced"]{--tone:var(--c-lang)}
.status[data-state="saving"],.status[data-state="reconciling"]{--tone:var(--muted)}
.status[data-state="offline"],.status[data-state="retrying"],.status[data-state="slow"],.status[data-state="expired"]{--tone:var(--c-job)}
.status[data-state="unreachable"],.status[data-state="toolarge"]{--tone:var(--red)}
.status button{background:none;border:0;color:var(--ink);text-decoration:underline;padding:4px 8px;font-size:12px}
.syncbar{--tone:var(--c-job);display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:16px 0 0;padding:12px 16px;background:var(--surface);color:var(--ink);font-size:14px;line-height:1.55;border:1px solid var(--line);border-left:4px solid var(--tone);border-radius:10px}
.syncbar[data-tone="error"]{--tone:var(--red)}
.syncbar[data-tone="info"]{--tone:var(--c-lang)}
.syncbar .sb-msg{flex:1 1 220px;min-width:0;word-break:break-word}
.syncbar button{min-height:36px;padding:4px 12px}
#loginNotice{flex-direction:column;align-items:stretch;gap:4px;margin:0 0 16px}
#loginNotice p{margin:0}
/* first sign-in wait card */
#boot{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px max(20px,env(safe-area-inset-right)) 48px max(20px,env(safe-area-inset-left))}
#boot h2{font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.2;margin:0}
#bootSub{color:var(--muted);margin:8px 0 0}
#boot .bar{margin:12px 0 8px}
#boot .bar i{width:40%;background:var(--c-lang);animation:bootslide 1.4s ease-in-out infinite}
@keyframes bootslide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
#boot .primary{width:100%;margin-top:16px}
@media (max-width:560px){#boot .primary{min-height:44px}}
@media (prefers-reduced-motion:reduce){#boot .bar i{animation:none}}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<body>
<section id="login" class="hidden" aria-labelledby="login-title">
  <h1 id="login-title">计划手记</h1>
  <p class="lead">登录后，记录会在你的手机和电脑之间同步</p>
  <div class="gate-card">
    <div id="loginNotice" class="syncbar hidden" role="status"></div>
    <form id="loginForm" novalidate>
      <label class="f" for="loginEmail">邮箱</label>
      <input type="email" id="loginEmail" name="email" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="login-err" required>
      <label class="f" for="loginPw">密码</label>
      <div class="pw-row"><input type="password" id="loginPw" name="password" autocomplete="current-password" aria-describedby="login-err" required><button type="button" class="ghost pw-toggle" aria-pressed="false" aria-label="显示密码">显示</button></div>
      <p id="login-err" role="alert"></p>
      <button type="submit" class="primary" id="loginBtn">登录</button>
    </form>
    <p class="fine">账号由管理员开通。忘记密码请联系管理员。</p>
  </div>
</section>
<section id="boot" class="hidden">
  <div class="gate-card" role="status">
    <h2 id="bootTitle">正在加载你的数据…</h2>
    <p id="bootSub">第一次登录需要先从服务器取数据</p>
    <div class="bar" id="bootBar"><i></i></div>
    <button type="button" class="primary hidden" id="bootRetry">重试</button>
  </div>
</section>
<div class="wrap">
  <header class="top">
    <div class="title">
      <h1>计划手记</h1>
      <p>语言、专业、健身、求职，每天记一点</p>
      <label class="arrival">开始日期 <input type="date" id="arrival"></label>
    </div>
    <div class="counter" id="counter"><span class="lbl">先设置开始日期</span></div>
  </header>

  <div id="syncbar" class="syncbar hidden" role="status"><span class="sb-msg"></span></div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="wk" aria-selected="true">本周</button>
    <button role="tab" data-tab="cal" aria-selected="false">日历</button>
    <button role="tab" data-tab="goal" aria-selected="false">目标</button>
    <button role="tab" data-tab="tl" aria-selected="false">时间线</button>
    <div class="toolbar">
      <button class="ghost hidden" id="snapshotBtn" aria-label="下载留底：另一台设备上的旧版本，下载后会从本机删除" title="下载留底：另一台设备上的旧版本，下载后会从本机删除">下载留底</button>
      <button class="ghost hidden" id="undoImportBtn" aria-label="撤销导入：恢复成导入前的样子" title="撤销导入：恢复成导入前的样子">撤销导入</button>
      <button class="ghost" id="exportCsv" title="导出为 CSV 表格文件，作为备用">导出日历 CSV</button>
      <button class="ghost" id="exportJson">备份</button>
      <button class="ghost" id="importBtn">恢复</button><input type="file" id="importJson" accept=".json,application/json" class="hidden">
      <span class="who hidden" id="who"></span>
      <button class="ghost hidden" id="logoutBtn">退出登录</button>
    </div>
  </nav>

  <section id="tab-wk">
    <div class="wk-head">
      <h2 id="wkTitle"></h2><span class="range" id="wkRange"></span>
      <div class="nav"><button class="icon" id="wkPrev" aria-label="上一周">‹</button><button class="ghost" id="wkNow">本周</button><button class="icon" id="wkNext" aria-label="下一周">›</button></div>
    </div>
    <p class="empty hidden" id="wkEmpty">当前计划是空的，这里只统计你记下的内容。可以在「目标」页建一份计划，或从示例里挑。</p>
    <div class="areas" id="areas"></div>
    <div class="wk-layout">
      <div>
        <div class="days" id="days"></div>
        <div class="review panel">
          <h3>本周复盘</h3>
          <p class="sub">哪些做得好，哪里卡住了，下周调整什么</p>
          <textarea id="review" placeholder="比如：这周坚持了哪些、哪里没做到，下周打算怎么调整"></textarea>
        </div>
      </div>
      <aside class="panel side" id="wkComp"></aside>
    </div>
  </section>

  <section id="tab-cal" class="hidden">
    <div class="cal-layout">
      <div>
        <div class="cal-head"><h2 id="monthTitle"></h2>
          <div class="nav"><button class="icon" id="prev" aria-label="上个月">‹</button><button class="ghost" id="todayBtn">今天</button><button class="icon" id="next" aria-label="下个月">›</button></div>
        </div>
        <div class="grid" id="dow"></div>
        <div class="grid" id="grid"></div>
      </div>
      <aside class="panel" id="dayPanel"></aside>
    </div>
  </section>

  <section id="tab-goal" class="hidden"><div class="goals" id="goals" tabindex="-1"></div></section>

  <section id="tab-tl" class="hidden">
    <div class="filters" id="filters"></div>
    <div class="tl" id="timeline"></div>
  </section>

  <section id="tab-plan" class="hidden" aria-labelledby="pe-title">
    <div class="pe-head"><h2 id="pe-title" tabindex="-1">编辑计划</h2><p>改动先存在这一页，点「保存计划」才生效；点「放弃这次修改」，计划完全不变。</p></div>
    <div id="pe-bar"><p id="pe-hint" role="status"></p><button type="button" class="ghost" id="pe-discard">放弃这次修改</button><button type="button" class="primary" id="pe-save" aria-describedby="pe-hint">保存计划</button></div>
    <div id="pe-notice" class="syncbar hidden" data-tone="warn"><span class="sb-msg"></span></div>

const pObj=v=>!!v&&typeof v==="object"&&!Array.isArray(v),pStr=v=>typeof v==="string",pNum=v=>typeof v==="number"&&isFinite(v);
/* 只信类型、返回新对象；任何一处不合格就返回 null（拒绝整份计划） */
function normalizePlan(p){
  if(!pObj(p)||!Array.isArray(p.groups)||!Array.isArray(p.lifts)||!pObj(p.presets))return null;
  const gids=new Set(),tids=new Set(),groups=[],lifts=[],presets={};

    if(!pObj(g)||!pStr(g.id)||!GROUP_ID_RE.test(g.id)||gids.has(g.id)||!pStr(g.cat)||!hasCat(g.cat)||!pStr(g.name)||!Array.isArray(g.tasks))return null;
    if(g.note!==undefined&&!pStr(g.note))return null;

    gids.add(g.id);

      if(!pObj(t)||!pStr(t.id)||!PLAN_TASK_ID_RE.test(t.id)||tids.has(t.id)||!pStr(t.text))return null;

  }
  const lids=new Set();
  for(const l of p.lifts){
    if(!pObj(l)||!pStr(l.id)||!LIFT_ID_RE.test(l.id)||lids.has(l.id)||!pStr(l.n)||!pStr(l.unit)||!pNum(l.def)||!pNum(l.target)||l.target<=0)return null;

let plan,planTasks,planIds,planCat,keepOrphans=false;

/* D-14、D-03、A17：归档的派生数据按 plan 的对象身份做缓存（archMemo），withPlan 和云端段的 normUnder 换 plan 时不用改；

const T_GROUP_UNKNOWN="未知目标组";

/* D-16：空计划 = 没有未归档的组，也没有未归档的力量项（可以保存，不会被示例计划顶替）；目标页换成空计划卡片，本周页多一行说明 */
function planEmpty(){return !activeGroups().length&&!activeLifts().length}

let state={arrival:"",tasks:{},custom:[],logs:[],lifts:{},reviews:{},presets:{}};
let store=null;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");

const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
/* WR-06：格式合格还要是真实存在的日历日期（2026-02-31 经 parse 会变成 03-03，往返不相等） */
const realDate=v=>typeof v==="string"&&DATE_RE.test(v)&&ymd(parse(v))===v;
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};

const compCat={c:"语言",w:"语言"};

function allTasks(){return planTasks.concat(state.custom||[])}
function tstate(id){return state.tasks[id]||{}}
function lift(id){const L=plan.lifts.find(x=>x.id===id)||{def:0};return Object.assign({cur:L.def,hist:[]},state.lifts[id]||{})}
/* 导入检查（D-07）：返回 null 表示没发现问题，否则返回一个简短的原因。容器里能识别出条目就检查，不看容器类型对不对。
   只供 classifyBackup 和单元用例调用：顶层不是普通对象（null、[]，即 synth-null.json、synth-array.json，N3 同类）和非字符串的 arrival（synth-wrong-types.json 的数字 arrival）这两种文件，现在都由外层的 classifyBackup 先拒绝，应用里没有调用路径把它们交给这个函数；
   函数体里的 if(!isObj(raw))return null 和只检查字符串 arrival 的那一行只服务单元用例，保留原样。
   原始值形式的容器（字符串、数字）里识别不出条目，v1 normalize 会把它们换成空值。 */
function importProblem(raw){
  if(!isObj(raw))return null;
  const items=c=>Array.isArray(c)?c:isObj(c)?Object.values(c):[];
  const okDate=realDate,optDate=v=>v===undefined||v===""||okDate(v);

  for(const c of items(raw.custom))if(!isObj(c)||typeof c.id!=="string"||!CUSTOM_ID_RE.test(c.id)||typeof c.group!=="string"||(c.group!==GROUP_NONE&&!GROUP_ID_RE.test(c.group)))return "custom";
  const t=raw.tasks;
  if(t!==null&&typeof t==="object")for(const k of Object.keys(t))if(!TASK_KEY_RE.test(k)||!isObj(t[k])||!optDate(t[k].due)||!optDate(t[k].doneDate))return "task";

  if(L!==null&&typeof L==="object")for(const k of Object.keys(L)){
    if(!LIFT_ID_RE.test(k)||!isObj(L[k]))return "lift";
    const h=L[k].hist;
    if(Array.isArray(h)||isObj(h))for(const x of items(h))if(!isObj(x)||!okDate(x.date))return "lift";
  }
  const R=raw.reviews;
  if(R!==null&&typeof R==="object")for(const k of Object.keys(R))if(!realDate(k))return "review";

}
/* D-08：加载和导入共用的修正。只改不合格的字段，对合格数据是恒等的、重复执行结果不变；不删任何带文字的记录，不调用 persist。
   进度键只在对应到当前计划任务（planIds）或修正后的自定义待办时保留，其余一律丢弃；planIds 由脚本求值时的 usePlan(DEFAULT_PLAN) 设好，早于加载和导入。 */
function normalize(s){
  const wordy=v=>typeof v==="string"||(typeof v==="number"&&isFinite(v));
  const asText=v=>typeof v==="string"?v:typeof v==="number"||typeof v==="boolean"?String(v):v==null?"":JSON.stringify(v);
  const entry=l=>isObj(l)?l:wordy(l)?{text:String(l)}:Array.isArray(l)&&l.some(wordy)?{text:JSON.stringify(l)}:null;
  const okDate=realDate,fin=v=>typeof v==="number"&&isFinite(v);
  const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
  const act=plan.groups.filter(g=>!g.archived),oth=act.length?(act.find(g=>g.cat==="其他")||act[act.length-1]).id:GROUP_NONE;
  const idMap=new Map();
  const logs=(Array.isArray(s.logs)?s.logs:[]).map(entry).filter(Boolean).map(l=>{
    const r={...l};
    if(typeof r.id!=="string"||!LOG_ID_RE.test(r.id))r.id=uid();
    if(!okDate(r.date))r.date=today();
    r.text=asText(r.text);
    if(typeof r.cat==="string"&&own(LEGACY,r.cat))r.cat=LEGACY[r.cat];
    if(typeof r.cat!=="string"||!hasCat(r.cat))r.cat="其他";
    return r;
  });
  const custom=(Array.isArray(s.custom)?s.custom:[]).map(entry).filter(Boolean).map(c=>{
    const r={...c};

      if(typeof old==="string"&&!planIds.has(old)&&!idMap.has(old))idMap.set(old,r.id);
    }
    if(r.group!==GROUP_NONE&&(typeof r.group!=="string"||!GROUP_ID_RE.test(r.group)))r.group=oth;
    r.text=asText(r.text);
    return r;
  });
  const cids=new Set(custom.map(c=>c.id));
  const tasks=Object.fromEntries(Object.keys(isObj(s.tasks)?s.tasks:{}).map(k=>[idMap.has(k)?idMap.get(k):k,s.tasks[k]]).filter(([k,v])=>isObj(v)&&(planIds.has(k)||cids.has(k)||(keepOrphans&&TASK_KEY_RE.test(k)))).map(([k,v])=>{
    const r={...v};
    if(r.done!==undefined&&typeof r.done!=="boolean")r.done=!!r.done;
    for(const f of ["doneDate","due"])if(r[f]!==undefined&&r[f]!==""&&!okDate(r[f]))r[f]="";

  }));
  const lifts=Object.fromEntries(Object.keys(isObj(s.lifts)?s.lifts:{}).filter(k=>LIFT_ID_RE.test(k)&&isObj(s.lifts[k])).map(k=>{
    const r={...s.lifts[k]};
    if(r.cur!==undefined&&!fin(r.cur))delete r.cur;
    if(r.hist!==undefined)r.hist=Array.isArray(r.hist)?r.hist.filter(x=>isObj(x)&&okDate(x.date)&&fin(x.v)):[];
    return [k,r];
  }));
  const reviews=Object.fromEntries(Object.keys(isObj(s.reviews)?s.reviews:{}).filter(k=>wordy(s.reviews[k])).map(k=>[k,String(s.reviews[k])]));
  const presets=Object.fromEntries(Object.keys(isObj(s.presets)?s.presets:{}).filter(k=>isObj(s.presets[k])).map(k=>{
    const r={...s.presets[k]};
    for(const f of ["add","hide"])if(r[f]!==undefined){if(Array.isArray(r[f]))r[f]=r[f].filter(x=>typeof x==="string");else delete r[f]}
    return [k,r];
  }));

/* D-08: a new sw.js waits (it never skips waiting on its own); the page offers "有新版本 / 点此更新" in #syncbar and reloads only after the click.

function swUnsaved(){

/* 进度条宽度：内联样式属性在发布版 CSP（style-src-attr 'none'）下不放行，模板里只写 data-w，每次整页重画后统一用 CSSOM 赋值 */
function goalsBars(){$("goals").querySelectorAll("i[data-w]").forEach(i=>{i.style.width=i.getAttribute("data-w")+"%"})}
/* D-03、D-05、IN-05：目标页底部默认折叠的「已归档（n）」区，灰色只读，没有任何输入和按钮。n = 归档的组 + 所在组没归档的单独归档任务 + 归档的力量项 + 找不到所属组的自定义待办（后者带删除按钮，WR-02）。
   展开状态存在 goalsArchOpen，重画不会把展开的区收起来 */
const T_ARCH_MARK="已归档",T_ARCH_TASKS="已归档的任务",T_ORPHAN_TASKS="没有所属目标组的待办",T_ARCH_OPEN="未完成",T_ARCH_DONE="已完成";
let goalsArchOpen=false;
const archStatus=s=>s.done?(s.doneDate?"已完成于 "+md(s.doneDate):T_ARCH_DONE):s.due?"截止 "+md(s.due):T_ARCH_OPEN;
function archivedHTML(){
  const row=(x,pre,id)=>`<div class="task ro" data-arch="t:${esc(id)}"><span class="tt">${esc(pre+x.text)}</span><span class="meta">${esc(archStatus(tstate(x.id)))}</span></div>`;
  const gs=plan.groups.filter(g=>g.archived),name=new Map(plan.groups.map(g=>[g.id,g.name]));
  const solo=allTasks().filter(x=>isArchived(x)&&name.has(x.group)&&!planMeta().garch.has(x.group));
  const ls=plan.lifts.filter(L=>L.archived);
  const orph=(state.custom||[]).filter(x=>!name.has(x.group));
  const n=gs.length+solo.length+ls.length+orph.length;if(!n)return "";
  const groups=gs.map(g=>{
    const ts=allTasks().filter(x=>x.group===g.id),dn=ts.filter(x=>tstate(x.id).done).length;
    return `<div class="group arch-g" data-arch="g:${esc(g.id)}"><div class="group-h"><span class="arch-mark">${T_ARCH_MARK}</span><h3>${esc(g.name)}</h3><span class="cnt">${dn}/${ts.length}</span></div>
    ${g.note?`<p class="note">${esc(g.note)}</p>`:""}
    <div class="bar"><i data-w="${ts.length?dn/ts.length*100:0}"></i></div>
    ${ts.map(x=>row(x,"",x.id)).join("")}</div>`}).join("");
  const alone=solo.length?`<p class="note">${T_ARCH_TASKS}</p>${solo.map(x=>row(x,name.get(x.group)+" · ",x.id)).join("")}`:"";
  const lifts=ls.map(L=>{const s=lift(L.id),pct=Math.min(100,(s.cur/L.target)*100);
    const h=s.hist.map(x=>`${esc(md(x.date))} ${esc(x.v)}`).join("，");
    return `<div class="lift arch-l" data-arch="l:${esc(L.id)}"><div class="ln">${esc(L.n)}</div><div class="lv">${esc(s.cur)}<small> / ${esc(L.target)} ${esc(L.unit)}</small></div>
    <div class="lbar"><i data-w="${pct}"></i></div>
    <div class="hist" data-hist="${s.hist.length}">${h||esc(L.note)}</div></div>`}).join("");
  const orphans=orph.length?`<p class="note">${T_ORPHAN_TASKS}</p>${orph.map(x=>`<div class="task ro" data-arch="o:${esc(x.id)}"><span class="tt">${esc(x.text)}</span><span class="meta">${esc(archStatus(tstate(x.id)))}<button class="x" data-deltask="${esc(x.id)}" aria-label="删除待办" title="删除待办">×</button></span></div>`).join("")}`:"";
  return `<details class="arch" id="goalsArch"${goalsArchOpen?" open":""}><summary>已归档（${n}）</summary>${groups}${alone}${lifts}${orphans}</details>`;
}

/* 事件委托在 #tab-plan 上：展开、折叠只改界面状态（不算修改）；输入框的值就地写进草稿并刷新同一张卡的名称，不整页重画 */
const peRoot=$("tab-plan");
peRoot.addEventListener("click",e=>{
  /* #peSampleBtn 不是草稿动作（不走 data-peact）：随时可用，不受 peBlock 影响（A13） */
  if(pe&&e.target.closest("#peSampleBtn")){openSamplePicker("edit");return}
  const t=e.target.closest("[data-peact]");if(!t||!pe)return;
  const a=t.dataset.peact,k=t.dataset.pekey||"";
  if(a==="toggle"){if(pe.open.has(k))pe.open.delete(k);else pe.open.add(k);renderPlanEditor()}
  else if(a==="cat"){const g=peGroup(k.slice(2));if(g&&hasCat(t.dataset.pecat)){g.cat=t.dataset.pecat;renderPlanEditor();peBar()}}
  else if(a==="addgroup")peAddGroup();
  else if(a==="addtask")peAddTask(k.slice(2));
  else if(a==="addlift")peAddLift();
  else if(a==="addtag")peAddTag(k.slice(2));
  else if(a==="dellift")peDelete("lift",k.slice(2));
  else if(a==="up"||a==="down")peMove(k,a==="up"?-1:1);

});

/* 行的下标在增删、换位之后变了：pe.seen 里这一类别的 p:<类别键>:<下标> 跟着改（fn 返回新下标，负数表示丢掉），免得“失焦过”的状态落到别的行上 */
function peSeenTag(ck,fn){const pre="p:"+ck+":",out=[];Array.from(pe.seen).forEach(x=>{if(x.startsWith(pre)){pe.seen.delete(x);const n=fn(+x.slice(pre.length));if(n>=0)out.push(pre+n)}});out.forEach(x=>pe.seen.add(x))}

/* 删除标签：标签没有“进度”，不走确认，直接从草稿移除，toast 带「撤销移除」（5000 ms），撤销放回原位；焦点落到下一行的输入框，没有就上一行，再没有就「＋ 添加标签」 */
function peDelTag(key){

function peUndoTag(s,ck,i,x){

/* 上移、下移（S3、S4）：只在同一个列表里，与最近的未归档邻居交换数组位置（归档项原地不动，不跨组），不改任何 id；焦点留在同一个按钮，到顶或到底变 disabled 时改到同一行的另一个排序按钮，再没有就到输入框（组卡折叠着就到开关）；不弹 toast，读屏区写一句 */
const peName=x=>x.name!==undefined?x.name||T_PE_UNNAMED:x.n!==undefined?x.n||T_PE_UNNAMED:x.text||T_PE_UNNAMED;
function peList(kind,id){

  if(kind==="lift")return {list:pe.draft.lifts,parent:null};

function peMove(key,dir){

  const list=L.list,i=list.findIndex(x=>x.id===id);if(i<0)return;

  if(j<0||j>=list.length)return;

/* 删除（D-01、S7）：没有进度的任务、没有进度也没有自定义待办的组、以及草稿里新加的项（不在 pe.origIds 里）直接从草稿移除，记进 pe.gone 并给「撤销移除」；有进度的只能确认后归档。进度按当前工作 state 判断（编辑页开着时远端更新挂起，所以等同打开时的数据） */
const peShort=x=>{const a=Array.from(x||T_PE_UNNAMED);return a.length>10?a.slice(0,10).join("")+"…":a.join("")};
const peQuote=x=>{const a=Array.from(x||T_PE_UNNAMED);return a.length>30?a.slice(0,30).join("")+"…":a.join("")};
const peItem=(kind,id)=>kind==="group"?peGroup(id):kind==="lift"?peLift(id):peTask(id);
function peDelete(kind,id){
  const it=peItem(kind,id);if(!it||!pe.origIds.has(id)){if(it)peRemove(kind,id);return}
  let prog;
  if(kind==="task")prog=taskHasProgress(state,id);
  else if(kind==="lift")prog=liftHistoryCount(state,id)>0;
  else{const p=groupProgress(state,it);prog=p.done>0||p.due>0||p.custom>0}

/* Phase 14：计划写入核心。编辑页的「保存计划」（savePlanDraft）和空计划卡片的「添加并保存」（pkSave）共用，只有这一条写入路径：
   容量检查 → 读不出来时先留底 → 覆盖时留底 → 按 id 差集清理 state → usePlan → 脏标记和缓存 → requestSync。
   np 是 normalizePlan 过的新计划，overwrite 表示用户选了「用我的覆盖」；返回 {ok:false,why:"toolarge"|"nokeep"}（什么都没写）或 {ok:true,unread,kept}；窗口、忙碌状态、toast 由调用方处理 */
function planCommit(np,overwrite){
  /* S9 第 5 步（planCommit）：4 MB 容量检查。超限就不保存、不留底、不上传，提示行和现有的容量超限横幅说明，留在编辑页；通过了就收起自己显示过的横幅。两种留底（读不出来的计划、用我的覆盖）都在这一步之后、写入之前 */
  if(sizeOf(np)>CLOUD_MAX){showTooLarge();return {ok:false,why:"toolarge"}}
  /* 所有者决定（2026-11-11）：账号的计划读不出来（keepOrphans 仍为真，并入的远端版本也读不出来）时，先把服务器上那份存成本机留底（与 D-07 的覆盖留底同一个机制，可下载），然后才替换；留底存不下就不保存，草稿留在页面上 */
  let unread=false;
  if(keepOrphans){
    const pc=cacheGet("plan");
    if(!(pc&&keepConflict("plan",{data:pc.data}))){toast(T_PE_UNREAD_NOKEEP,null,6000);return {ok:false,why:"nokeep"}}
    unread=true;
  }
  /* 用我的覆盖：此刻的工作计划就是被盖掉的那一版（已并入最新的挂起版本），写入之前存成本机留底（可下载）；留底存不下时照常保存，离开后用「留底没存上」横幅说明，不说假话 */
  let kept=null;
  if(overwrite&&!unread)kept=keepConflict("plan",{data:JSON.parse(JSON.stringify(plan))});
  /* 离开计划的任务、组和力量项（直接移除、以后的彻底删除）：它们的进度键、组里的自定义待办和待办的进度、力量项的 state.lifts[id]（当前值和历史）经 commit 从 state 删除；归档的项仍在新计划里，进度原样。计划读不出来时（keepOrphans）页面显示的是示例计划，下一次加载本来就会丢掉对不上的进度键，这里不动 state。差集在 usePlan 换掉旧计划之前算 */
  const outT=[],outC=[],outL=[];
  if(!keepOrphans){
    const nt=new Set(np.groups.flatMap(g=>g.tasks.map(t=>t.id))),ng=new Set(np.groups.map(g=>g.id)),nl=new Set(np.lifts.map(l=>l.id));
    plan.lifts.forEach(l=>{if(!nl.has(l.id)&&state.lifts[l.id]!==undefined)outL.push(l.id)});
    planTasks.forEach(t=>{if(!nt.has(t.id)&&state.tasks[t.id]!==undefined)outT.push(t.id)});
    (state.custom||[]).forEach(c=>{if(isObj(c)&&!ng.has(c.group)&&plan.groups.some(g=>g.id===c.group)){outC.push(c.id)}});
  }
  usePlan(np);keepOrphans=false;
  docs.plan.dirty=true;docs.plan.seq=(docs.plan.seq||0)+1;
  if(!cachePut("plan",{...docs.plan,data:np}))cacheNote(false);
  if(outT.length||outC.length||outL.length){
    const dt=outT.slice(),dc=new Set(outC),dl=outL.slice();
    commit(dt.map(i=>"task:"+i).concat(outC.map(i=>"custom:"+i),dl.map(i=>"lift:"+i)),st=>{dt.forEach(i=>{delete st.tasks[i]});dc.forEach(i=>{delete st.tasks[i]});st.custom=(st.custom||[]).filter(c=>!dc.has(c.id));dl.forEach(i=>{delete st.lifts[i]})});
  }

}
/* planCommit 成功之后的 toast：读不出来的计划被替换 → 留底提示；覆盖了别的设备的版本 → 留底提示；否则普通成功 toast（覆盖时先收起留底通知）。msg、ms 是普通成功 toast 的文案和时长 */
function planSavedToast(r,overwrite,msg,ms){
  if(r.unread){snapShow();toast(T_PE_SAVED_UNREAD,{label:"下载留底",fn:snapDownload},8000);snapTold()}
  else if(overwrite&&r.kept){snapShow();toast(T_PE_SAVED_KEPT,{label:"下载留底",fn:snapDownload},8000);snapTold()}

async function savePlanDraft(){

  const blk=peBlock();

  if(!planDirty())return;
  const ep=sessionEpoch,live=()=>pe===s&&ep===sessionEpoch;
  /* D-17、S6：先检查草稿；有问题就不保存，展开含错误的卡，提示行写数量，焦点移到第一个出错的字段。要并入远端版本、存计划都在这之后 */
  const pr=planProblems(s.draft);
  if(pr.length){
    s.tried=true;
    pr.forEach(x=>{const c=peCardOf(x.key);if(c)s.open.add(c)});
    renderPlanEditor();peBar();peFocus(peFid(pr[0].key));
    return;
  }
  s.busy=true;peBar();
  const merge=()=>{if(takeRemote()){remoteView=false;hideBar("remote");renderKeep()}},back=()=>{s.busy=false;peBar()};
  merge();

  let overwrite=false;
  if(peChanged()){
    const r=await confirmBox({title:T_PE_CF_TITLE,lines:[T_PE_CF_L1,T_PE_CF_L2,T_PE_CF_L3,T_PE_CF_L4],cancel:T_PE_BACK,mid:{text:T_PE_TAKE,cls:"danger"},ok:T_PE_OVERWRITE,scope:"plan"});
    if(!live())return;

  /* S9 第 4 步（D-08）：草稿里直接移除的项（pe.gone），按最新的进度（上面已并入）再查一遍；刚在别的设备上有了进度的，一个框列出全部，回去继续改 / 全部归档 / 连进度一起删，两个选择对列出的全部项生效；没有这样的项不弹 */
  const hits=s.gone.filter(peGoneHit);
  if(hits.length){
    const lines=[T_PE_D8_INTRO];
    hits.slice(0,8).forEach(r=>lines.push(peD8Line(r)));
    if(hits.length>8)lines.push(T_PE_D8_MORE(hits.length-8));
    lines.push(T_PE_D8_Q);
    const r=await confirmBox({title:T_PE_D8_TITLE,lines,cancel:T_PE_BACK,mid:{text:T_PE_D8_ARCHIVE,cls:"primary"},ok:T_PE_D8_DELETE,scope:"plan"});
    if(!live())return;
    if(r===false){back();return}
    /* 对话框开着时又来了别的设备改的计划：没有选过覆盖就回到编辑页，提示出来，下次点保存再按三选一问 */
    merge();
    if(!overwrite&&peChanged()){back();peRemote();return}
    if(r==="mid"){peArchiveGone(s.gone.filter(peGoneHit));renderPlanEditor()}
  }
  const np=normalizePlan(s.draft);
  if(!np){back();return}
  /* WR-02：名称、任务文字、单位和标签保存时去掉首尾空格（planProblems 判空和判重复本来就按 trim 之后的值） */
  np.groups.forEach(g=>{g.name=g.name.trim();g.tasks.forEach(t=>{t.text=t.text.trim()})});np.lifts.forEach(L=>{L.n=L.n.trim();L.unit=L.unit.trim()});Object.keys(np.presets).forEach(k=>{np.presets[k]=np.presets[k].map(x=>x.trim())});

  if(!r.ok){if(r.why==="toolarge")s.tooLarge=true;back();return}
  closePlanEditor("goal");
  planSavedToast(r,overwrite,T_PE_SAVED,3000);
}

async function pkSave(){
  const s=pk;
  if(!s||s.busy)return;
  /* 12 D-11、D-12：过期或断网时不保存（和保存计划同一句） */
  const blk=peBlock();
  if(blk){toast(blk,null,3000);return}
  const ep=sessionEpoch,live=()=>pk===s&&ep===sessionEpoch;
  pkBusy(true);
  const merge=()=>{if(takeRemote()){remoteView=false;hideBar("remote");renderKeep()}};
  /* 并入挂起的远端版本（挑选期间远端更新一直挂着，isBusy 含 pkDlg.open） */
  merge();
  /* D-07、12 D-07：打开对话框之后别的设备改过了计划（内容和打开时看到的不同）→ 三选一。回去继续挑（取消、Esc、点遮罩）什么都不变，勾选保留；放弃我的选择，用新版：不加、不写，目标页显示别的设备的计划；用我的覆盖：以打开时看到的计划加上挑的项保存，被盖掉的那一版在写入之前由 planCommit 留底。每处 await 之后核对会话 */
  let overwrite=false;
  if(peCanon(plan)!==s.orig){
    const r=await confirmBox({title:T_PE_CF_TITLE,lines:[T_PK_CF_L1,T_PK_CF_L2,T_PK_CF_L3,T_PK_CF_L4],cancel:T_PK_BACK,mid:{text:T_PK_TAKE,cls:"danger"},ok:T_PE_OVERWRITE,scope:"plan"});
    if(!live())return;
    if(r===false){pkBusy(false);const o=$("pkOk");if(o)o.focus();return}
    merge();
    if(r==="mid"){
      renderAll();
      s.focus=$("planEditBtn")||$("planEditBtn2")||$("goals");
      pkDlg.close();
      toast(T_PK_TAKEN,null,6000);
      return;
    }
    overwrite=true;
  }
  /* 新项以打开对话框时看到的那份计划（s.base）为底往末尾追加；新 id 要避开两份计划里已有的 id */
  const {keys,g,l}=pkPicked();
  const add=pickSample(keys,new Set([...planUsedIds(s.base),...planUsedIds(plan)]));
  const draft=JSON.parse(JSON.stringify(s.base));
  add.groups.forEach(x=>draft.groups.push(x));add.lifts.forEach(x=>draft.lifts.push(x));
  const np=normalizePlan(draft);
  if(!np){pkBusy(false);return}
  const r=planCommit(np,overwrite);
  if(!r.ok){if(r.why==="toolarge")s.tooLarge=true;pkBusy(false);pkHint();return}
  if(s.tooLarge)peClearTooLarge();
  renderAll();
  s.focus=$("planEditBtn")||$("goals");
  pkDlg.close();
  planSavedToast(r,overwrite,T_PK_DONE(g,l),4000);
}

$("pkOk").addEventListener("click",()=>{if($("pkOk").getAttribute("aria-disabled")==="true"){const blk=pk&&pk.mode==="card"?peBlock():"";if(blk)toast(blk,null,3000);return}if(pk&&pk.mode==="card")pkSave();else if(pk&&pk.mode==="edit")pkAddToDraft()});
$("pkCancel").addEventListener("click",()=>pkDlg.close());
pkDlg.addEventListener("cancel",e=>{if(pk&&pk.busy)e.preventDefault()});
pkDlg.addEventListener("click",e=>{if(e.target===pkDlg&&!(pk&&pk.busy))pkDlg.close()});
pkDlg.addEventListener("close",()=>{
  const s=pk;
  if(s){const f=s.focus||(s.back&&s.back.isConnected?s.back:(s.mode==="edit"?$("peSampleBtn"):null));try{if(f&&f.isConnected&&typeof f.focus==="function"){f.focus();if(s.scroll)f.scrollIntoView({block:"center",behavior:"auto"})}}catch(e){}if(s.tooLarge)peClearTooLarge()}
  pk=null;
  if(remoteView)maybeApplyView();
});

/* ---------- export / import ---------- */
/* B7: 日历工具可能把以 = + - @、制表符、回车开头的单元格当公式执行，这样的单元格前面多一个英文单引号，然后才按逗号、引号、换行、回车加引号。不加 BOM。 */
function csvCell(s){s=String(s);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function usDate(s){return s.slice(5,7)+"/"+s.slice(8)+"/"+s.slice(0,4)}
/* 三个下载（备份、日历 CSV、下载留底）共用的浏览器原生下载：Blob 加临时 <a download>。对象地址必须比这次点击活得久（浏览器可能还在问用户是否允许下载），所以 30 秒后才 revoke；抛错时 revoke 已建的地址并返回 false */
function blobDownload(name,text,type){
  let url=null;
  try{
    url=URL.createObjectURL(new Blob([text],{type}));
    const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  }catch(e){
    if(url)try{URL.revokeObjectURL(url)}catch(x){}
    return false;
  }
  setTimeout(()=>URL.revokeObjectURL(url),30000);
  return true;
}
/* note: shown instead of the plain "已导出" (and for longer) when the file has something the user should know; a failed download still says it is unavailable */
const T_EXPORT_SAMPLE_PLAN="已导出。账号的计划读不出来，备份里的计划是示例计划，导入它会换掉账号的计划。";
function saveFile(name,text,type,note){const ok=blobDownload(name,text,type);if(ok&&note)toast(note,null,6000);else toast(ok?"已导出":"导出不可用")}
$("exportCsv").onclick=()=>{
  if(remoteView)applyView();
  const rows=[["Subject","Start Date","All Day Event","Description"]];
  state.logs.forEach(l=>rows.push(["["+l.cat+"] "+l.text.split("\n")[0].slice(0,80),usDate(l.date),"True",l.text]));
  allTasks().forEach(t=>{const s=tstate(t.id);
    if(s.done&&s.doneDate)rows.push(["完成："+t.text,usDate(s.doneDate),"True",groupLabel(t.group)+" 计划"]);
    else if(s.due&&!isArchived(t))rows.push(["截止："+t.text,usDate(s.due),"True",groupLabel(t.group)+" 计划"])});
  if(rows.length===1){toast("还没有可导出的日期");return}
  saveFile("计划手记-日历.csv",rows.map(r=>r.map(csvCell).join(",")).join("\n"),"text/csv;charset=utf-8");
};
/* 备份是新格式完整备份（D-10：旧路径也一样）；有别的设备的更新正等着显示时先按 Phase 10 的规则应用，文件与账号当前数据一致 */
$("exportJson").onclick=()=>{
  if(remoteView)applyView();
  /* keepOrphans: the account plan could not be read and plan is the sample plan, so the file says "full backup" with a plan that is not the account's (IN-05) */
  saveFile("计划手记-备份-"+today()+".json",JSON.stringify(backupOf(plan,state,new Date().toISOString()),null,2),"application/json",keepOrphans?T_EXPORT_SAMPLE_PLAN:undefined);
};
$("importBtn").onclick=()=>$("importJson").click();
$("importJson").addEventListener("change",e=>{onImportFile(e.target)});

let tt;function toast(m,act,ms){const t=$("toast");if(ms!=null)t.setAttribute("data-cloud","");else t.removeAttribute("data-cloud");t.textContent="";const s=document.createElement("span");s.textContent=m;t.appendChild(s);
  t.classList.toggle("act",!!act);
  if(act){const b=document.createElement("button");b.type="button";b.textContent=act.label;b.onclick=()=>{clearTimeout(tt);t.classList.remove("on","act");act.fn()};t.appendChild(b)}
  t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on","act"),ms!=null?ms:act?5000:1800)}

init();
