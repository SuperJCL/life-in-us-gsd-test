<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>线路实测</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; font: 16px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 560px; margin-inline: auto; }
h1 { font-size: 20px; margin: 0 0 8px; }
p { margin: 6px 0; }
fieldset { border: 1px solid #8886; border-radius: 8px; margin: 12px 0; padding: 8px 12px; }
legend { padding: 0 6px; font-weight: 600; }
label { display: inline-block; margin: 4px 14px 4px 0; }
button { font: inherit; padding: 10px 28px; border-radius: 8px; border: 1px solid #8888; cursor: pointer; }
button:disabled { opacity: .5; cursor: not-allowed; }
#status { margin-top: 14px; font-weight: 600; }
#left { color: #888; }
#summary { margin: 12px 0; padding: 10px 12px; border: 1px solid #8886; border-radius: 8px; white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
#shot { margin: 12px 0; padding: 10px 12px; border: 2px solid #c33; border-radius: 8px; color: #c33; font-weight: 600; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<h1>线路实测</h1>
<p>请先选运营商和网络类型，再点“开始”。测试约 10 分钟，期间请不要锁屏、不要切后台、不要换网络。</p>
<fieldset>
<legend>运营商</legend>
<label><input type="radio" name="carrier" value="telecom"> 电信</label>
<label><input type="radio" name="carrier" value="unicom"> 联通</label>
<label><input type="radio" name="carrier" value="mobile"> 移动</label>
<label><input type="radio" name="carrier" value="us"> 美国</label>
</fieldset>
<fieldset>
<legend>网络类型</legend>
<label><input type="radio" name="net" value="cell4g"> 手机 4G</label>
<label><input type="radio" name="net" value="home"> 家宽</label>
<label><input type="radio" name="net" value="other"> 其他</label>
</fieldset>
<p><button id="start" type="button" disabled>开始</button></p>
<p id="status" role="status" aria-live="polite">请选择运营商和网络类型。</p>
<p id="left"></p>
<div id="summary" hidden></div>
<div id="shot" hidden>上传失败，请截图这一屏（截图里不要带地址栏），发给组织测试的人。</div>
<script src="vendor/pocketbase.iife.js"></script>
<script src="config.js"></script>
<script src="probe.js"></script>
</body>
</html>
