# usj-probe-locations.conf —— 探针站点的 nginx 位置块（Phase 6，06-07，D-02、D-13）
#
# 装到 /etc/nginx/snippets/usj-probe-locations.conf，由 certbot 管理的 443 server 块用一行 include 引入
# （05-nginx-probe.sh 负责，只在锚点行之后追加这一行）。所以这个文件只含 location 块：
# 不含 listen、ssl_certificate、server_name，也不在 server 层加任何指令。
#
# 为什么每个位置都自带 access_log off 和 add_header：
#   - add_header 只在当前层没有同名指令时才继承上层；既然不在 server 层写，就在每个位置里写全。
#   - 探针站点不在访问日志里留客户端 IP（D-09）：每个位置都关闭访问日志。错误日志保持 nginx 默认。
#
# D-13：/_/（PocketBase 后台）在探针阶段对公网开放，靠强口令和 PocketBase 自带限流保护，
#   所以这里把它反代给 PocketBase，不写任何返回 404 的位置。两步验证和 IP 白名单留到 Phase 13。
#
# 每个反代位置都显式写 proxy_http_version 1.1 和空的 Connection 头：本机 nginx 是 1.24，
#   默认用 HTTP/1.0 连上游，实时连接（SSE）会被憋住（RESEARCH Pitfall 1）。
# X-Real-IP 用 $remote_addr：nginx 会覆盖客户端自带的同名头，PocketBase 的“用户 IP 代理头”设为 X-Real-IP。

# 实时连接（SSE）：精确匹配，GET 建连和 POST 订阅都走这里。关缓冲、关缓存、长读超时。
location = /api/realtime {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 1m;
    access_log off;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# 其余接口：普通反代
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
    gzip on;
    gzip_types application/json;
    access_log off;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# PocketBase 后台（D-13，对公网开放）
location ^~ /_/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    access_log off;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# 静态探针页：每次都完整下载，保证“首屏”是冷加载
location ^~ /probe/ {
    root /var/www/usj;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json;
    access_log off;
    server_tokens off;
}
