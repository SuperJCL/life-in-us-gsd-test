# usj-headers-proxy.conf —— 反代位置的安全响应头（Phase 13，13-07，SEC-02）
#
# 装到 /etc/nginx/snippets/usj-headers-proxy.conf。给转给 PocketBase 的三个位置用：
#   = /api/realtime、^~ /api/、^~ /_/。
# 为什么只有这 4 条：PocketBase 自己会发 X-Content-Type-Options: nosniff、X-Frame-Options，
#   后台 /_/ 还有自己的 CSP；nginx 如果在这里再发一份，响应里会出现重复的头，
#   或者把后台需要的内联脚本策略覆盖掉（后台就打不开）。所以这里不发 nosniff、X-Frame-Options 和任何 CSP。
#   这 4 条是 PocketBase 不发的：搜索引擎、Referrer、浏览器能力、HSTS。
# 每条都带 always（原因同 usj-headers-common.conf）；HSTS 先用一天，不加 includeSubDomains 和 preload。

add_header X-Robots-Tag "noindex, nofollow" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=86400" always;
