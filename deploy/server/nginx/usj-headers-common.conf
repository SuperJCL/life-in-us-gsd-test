# usj-headers-common.conf —— 静态位置的安全响应头（Phase 13，13-07，SEC-02）
#
# 装到 /etc/nginx/snippets/usj-headers-common.conf。给“nginx 自己发文件”的位置用：
#   = /、= /sw.js、= /manifest.webmanifest、^~ /vendor/、^~ /icons/。
#   反代位置不用这个文件，用 usj-headers-proxy.conf（见那个文件的说明）。
# 每条都带 always：没有 always 时 nginx 只在 2xx/3xx 响应上加头，404 和 5xx 就没有了。
# 为什么每个位置都要 include：location 里只要有自己的 add_header，上层（server 层）的 add_header 就一条都不继承，
#   所以这些头不能写在 server 层，要在每个位置里写全。
# HSTS 先用一天（86400 秒）：证书续期出问题时影响最多一天；验收通过并见过一次真实续期之后再提高（README 写明）。
#   不加 includeSubDomains 和 preload：子域名情况未知。
# X-Robots-Tag 与页面里的 noindex 一致：这是私人的小站，不让搜索引擎收录。
# 页面自己的 CSP 不在这里（由构建生成 usj-csp.conf，只给 = / 用）。

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Strict-Transport-Security "max-age=86400" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
