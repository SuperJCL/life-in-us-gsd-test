# usj-log-format.conf —— 访问日志的格式（Phase 13，13-07，D-03、SEC-02、T-13-19）
#
# 装到 /etc/nginx/conf.d/usj-log-format.conf（05-nginx-app.sh 负责）。
#
# 为什么放在 conf.d：nginx 的 log_format 只能写在 http 层，不能写在 server 或 location 里；
#   /etc/nginx/nginx.conf 的 http 块 include 了 conf.d/*.conf，05 在动手之前先核对这一点。
# 为什么用 $uri 而不是 $request 或 $request_uri：$uri 不含查询串。PocketBase 后台“下载备份”的链接带
#   ?token=（短时有效的超级用户文件令牌），整条请求行写进日志就等于把令牌写进磁盘。
#   这里只记请求方法、路径和协议版本；客户端 IP 按 D-03 要记（限流和排障要用）。
# 日志只留在服务器上；导出或报告一律先经本机的 redact.mjs。

log_format usj '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
