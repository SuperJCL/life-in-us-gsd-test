# usj-app.conf —— 应用站点的 nginx 指令和位置块（Phase 13，13-07，SEC-02、D-01、D-03）
#
# 装到 /etc/nginx/snippets/usj-app.conf，由 certbot 管理的 443 server 块用一行
#   `include snippets/usj-app.conf; # usj-app` 引入（05-nginx-app.sh 负责，只在锚点行之后放这一行，
#   同时删掉探针的 include）。所以这个文件只含 server 层指令和 location 块：
#   没有 listen、ssl_certificate、server_name，也不改 certbot 管理的任何一行。
# 文件里没有域名和 IP 地址（回环地址除外）：www 跳转放在 05 按条件生成的片段里，用正则捕获，不写主机名。
#
# 响应头的规则：location 里只要有自己的 add_header，上层的 add_header 就一条都不继承，
#   所以每个位置都显式 include 一个头文件，加上自己需要的 add_header（都带 always）：
#   静态位置用 usj-headers-common.conf，反代位置用 usj-headers-proxy.conf（理由写在两个文件里）。
# 访问日志：server 层统一记（D-03，记客户端 IP 和不含查询串的 $uri）；没有任何位置关闭访问日志。
# IP 头：每个反代位置都用 $remote_addr 覆盖 X-Real-IP（客户端自带的同名头会被覆盖，伪造不了），
#   与 PocketBase 的 trustedProxy.headers=["X-Real-IP"]（13-05）一致；8090 只绑回环，外部直连不到它。
# 请求体：/api/ 设 5m（应用文档上限 4 MiB，加 JSON 转义和字段开销）；实时连接只收很小的订阅请求，保持 1m。
#
# 位置的匹配顺序：= 精确匹配最先；^~ 前缀匹配命中后不再试正则；最后的正则位置 ~ ^/ 兜底返回 404。
#   正则位置优先于 certbot 块里原有的普通前缀位置（location /），所以其余路径一律 404，不会露出默认站点的内容；
#   写成正则而不是 `location ^~ /`，是为了不和原有的 `location /` 重名。

access_log /var/log/usj/access.log usj;
server_tokens off;

# 只保留一个源：Service Worker 的缓存和本机待上传的修改都按源保存，www 和裸域名各存一份会让人困惑。
# 这个片段由 05 生成：证书覆盖 www 并且 www 能解析才写跳转，否则只有一行注释。
include snippets/usj-www-redirect.conf;

# ---------- 静态：页面 ----------
# 不能用 index 指令：它会内部跳转到 /index.html，落进最后的 404 位置；try_files 直接给文件。
location = / {
    root /var/www/usj/site;
    try_files /index.html =404;
    include snippets/usj-headers-common.conf;
    include snippets/usj-csp.conf;
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_vary on;
}

# Service Worker：每次都向服务器核对，更新才发得出去；只允许连回自己
location = /sw.js {
    root /var/www/usj/site;
    include snippets/usj-headers-common.conf;
    add_header Content-Security-Policy "default-src 'none'; connect-src 'self'" always;
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_vary on;
    gzip_types text/javascript application/javascript;
}

# 清单：显式写 mime 类型，不依赖 mime.types 里有没有 webmanifest
location = /manifest.webmanifest {
    root /var/www/usj/site;
    types { application/manifest+json webmanifest; }
    default_type application/manifest+json;
    include snippets/usj-headers-common.conf;
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_vary on;
    gzip_types application/manifest+json application/json;
}

# 脚本库（PocketBase SDK）：每次核对，页面与 SDK 同时更新
location ^~ /vendor/ {
    root /var/www/usj/site;
    include snippets/usj-headers-common.conf;
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_vary on;
    gzip_types text/javascript application/javascript;
}

# 图标：可以缓存一小时
location ^~ /icons/ {
    root /var/www/usj/site;
    include snippets/usj-headers-common.conf;
    add_header Cache-Control "public, max-age=3600" always;
}

# ---------- 反代：PocketBase ----------
# 实时连接（SSE）：精确匹配，GET 建连和 POST 订阅都走这里。参数沿用 Phase 6 验证过的：
#   HTTP/1.1、Connection 头置空、关代理缓冲和缓存、关 gzip、读写超时 3600 秒。
location = /api/realtime {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 1m;
    include snippets/usj-headers-proxy.conf;
}

# 其余接口：普通反代
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 5m;
    gzip on;
    gzip_types application/json;
    include snippets/usj-headers-proxy.conf;
}

# PocketBase 后台：自带 CSP、nosniff、X-Frame-Options，nginx 不覆盖
location ^~ /_/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    include snippets/usj-headers-proxy.conf;
}

# ---------- 其余路径一律 404 ----------
location ~ ^/ {
    include snippets/usj-headers-common.conf;
    return 404;
}
